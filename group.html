<style>
*{box-sizing:border-box}
:root{--bg:#fffaf7;--card:#fff;--ink:#17212b;--muted:#69737c;--line:#eee1da;--accent:#ff5961}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.wrap{max-width:760px;margin:auto;padding:20px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}
.brand{font-size:25px;font-weight:950;letter-spacing:-1.1px} .brand span{color:var(--accent)}
.navbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:750}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:25px;box-shadow:0 18px 55px #2b201b12;margin:16px 0}
.eyebrow{font-size:12px;letter-spacing:1.35px;text-transform:uppercase;font-weight:900;color:var(--accent)}
h1{font-size:44px;line-height:1;letter-spacing:-2.7px;margin:12px 0 16px}
h2{font-size:30px;line-height:1.05;letter-spacing:-1.5px;margin:8px 0 12px}
.muted{color:var(--muted);line-height:1.55}
.primary,.secondary{width:100%;padding:15px 16px;border-radius:15px;font-weight:900}
.primary{border:0;background:var(--accent);color:white;box-shadow:0 10px 25px #ff59612c}
.secondary{border:1px solid #ddd0c9;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin:17px 0} .field label{display:block;font-weight:800;margin-bottom:8px}
.field input,.field select{width:100%;border:1px solid #ddd0c9;border-radius:14px;padding:14px;background:#fff;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #ddd0c9;background:#fff;border-radius:999px;padding:10px 13px;font-weight:750}.tag.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{height:290px;border-radius:22px;background-size:cover;background-position:center;margin:-25px -25px 22px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.badge,.person{font-size:13px;padding:8px 10px;border-radius:999px;background:#f5efec}
.progress{height:6px;background:#eee5e0;border-radius:99px;overflow:hidden;margin:15px 0}
.progress i{display:block;height:100%;background:var(--accent)}
.people{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:15px 0}
.match{text-align:center} .big{font-size:58px}
.linkbox{word-break:break-all;background:#f7f3f1;border-radius:14px;padding:13px;font-size:13px;margin:12px 0}
.summary{background:#faf6f3;border-radius:16px;padding:14px;margin:14px 0}.summary b{display:block;margin-bottom:5px}
.notice{padding:13px;border-radius:14px;background:#fff1ee;color:#8f3d43;font-size:13px;line-height:1.45;margin:14px 0}
.tiny{font-size:12px;color:#8b9298;text-align:center;margin:24px 0}
.desttitle{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}

.resultgrid{display:grid;gap:10px;margin:16px 0}
.resultitem{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:#fff}
.resultitem strong{font-size:17px}.resultmeta{font-size:12px;color:var(--muted);margin-top:3px}
.matchlist{display:grid;gap:10px;margin:16px 0}.matchitem{padding:15px;border-radius:18px;background:#faf6f3;border:1px solid var(--line);text-align:left}
.matchitem .place{font-weight:900;font-size:18px}.statusline{font-size:13px;color:var(--muted);margin:8px 0 0}

.dashboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:8px}
.dashboard-title{margin:6px 0 4px}.dashboard-code{font-size:12px;font-weight:850;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{background:#faf6f3;border:1px solid var(--line);border-radius:16px;padding:13px 10px;text-align:center}
.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.sectiontitle{font-size:14px;font-weight:900;margin:20px 0 9px}
.memberrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f1e8e3}.memberrow:last-child{border-bottom:0}
.membername{font-weight:850}.done{color:#26734d;background:#edf8f1}.waiting{color:#8a5a20;background:#fff5e7}.statuspill{font-size:11px;font-weight:850;padding:7px 9px;border-radius:999px;white-space:nowrap}
.dashboard-actions{display:grid;gap:9px;margin-top:18px}.emptybox{padding:14px;border-radius:16px;background:#faf6f3;color:var(--muted);font-size:13px;line-height:1.45}


.funstrip{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0 2px}.funpill{font-size:11px;font-weight:850;padding:7px 9px;border-radius:999px;background:#fff3f2;color:#cf4f51;border:1px solid #ffd8d5}
.desttagline{font-size:15px;line-height:1.45;margin:4px 0 12px;color:#626b75}.fitbox{margin:12px 0;padding:12px 13px;border-radius:16px;background:#faf6f3;border:1px solid var(--line)}
.fitbox b{display:block;font-size:12px;margin-bottom:4px}.fitbox span{font-size:13px;color:var(--muted)}.funpick{margin-top:9px}.destinationcount{font-size:12px;font-weight:800;color:#8b9298;margin-top:12px;text-align:center}

.swipecard{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:50% 92%;will-change:transform,opacity}
.swipe-stamp{position:absolute;top:38px;z-index:5;padding:7px 12px;border:3px solid currentColor;border-radius:12px;font-size:25px;font-weight:950;letter-spacing:1.5px;opacity:0;pointer-events:none;background:#ffffffdf}
.swipe-like{right:28px;color:#238653;transform:rotate(10deg)}
.swipe-pass{left:28px;color:#c44950;transform:rotate(-10deg)}
.swipehint{text-align:center;font-size:12px;color:#8b9298;margin:12px 0 0}.swipecard button{touch-action:manipulation}
@media(max-width:560px){h1{font-size:40px}.wrap{padding:18px}.row{grid-template-columns:1fr}}

/* Shared TripMatch visual system: all application screens */
:root{--tm-gradient:linear-gradient(105deg,#c91e59,#ce3b38);--tm-accent:#c91e59;--tm-ink:#24232d;--tm-muted:#696b77;--tm-line:#e6e5ec;--tm-soft:#f6f5f8;--bg:#faf9fb;--ink:var(--tm-ink);--muted:var(--tm-muted);--line:var(--tm-line);--accent:var(--tm-accent)}
body{font-family:"Avenir Next",Avenir,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--tm-ink)}.brand{font-family:inherit;font-size:28px;font-weight:800;letter-spacing:-1.5px}.brand span{color:#d63159}.nav{align-items:center}.iconbtn,.navbtn{font-size:13px;font-weight:650;color:var(--tm-ink);border:1px solid var(--tm-line);border-radius:24px;background:#fff;padding:10px 15px;min-height:42px}
.card{border-radius:22px;border:1px solid var(--tm-line);box-shadow:0 4px 24px #241e3205;background:#fff}h1,h2,h3{font-family:inherit;color:var(--tm-ink)}h1{font-weight:800;letter-spacing:-1.8px}h2{font-weight:750;font-size:29px;letter-spacing:-1px;line-height:1.15}h3{font-weight:700}.eyebrow,.matches-card .eyebrow,.auth-card .eyebrow{font-size:10px;line-height:1.5;font-weight:700;letter-spacing:1.6px;color:#a82550}.muted{color:var(--tm-muted);line-height:1.6}.primary,.auth-card .primary,.account-card .primary,.like{background:var(--tm-gradient);border:0;border-radius:28px;color:white;font-weight:650;min-height:50px;box-shadow:none}.secondary,.pass{border:1px solid #d8d7e0;border-radius:28px;background:white;color:var(--tm-ink);font-weight:650;min-height:50px}.primary:hover,.like:hover{filter:brightness(1.06)}.primary:disabled,.like:disabled,.secondary:disabled{opacity:.5;cursor:wait}
.field label{font-size:14px;font-weight:600;margin-bottom:8px}.field input,.field select,.field textarea{font-size:16px;border:1px solid #dcdbe3;border-radius:13px;padding:13px 14px;background:#fff;color:var(--tm-ink)}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #e284a0;outline-offset:2px}.field input[type=range]{padding:8px 0;accent-color:#c91e59}.tag{font-size:13px;font-weight:550;padding:9px 13px;min-height:38px;border-color:#dedce5;color:#555360}.tag.on{background:#fff0f4;border-color:#c94a71;color:#992448}.summary,.profilebody .summary,.stat,.fitbox,.emptybox,.linkbox,.matchitem{background:var(--tm-soft);border-radius:14px}.summary b{font-size:14px;font-weight:650}.summary .muted{font-size:14px}.chip,.badge,.person{background:#f1eff5;color:#565160;font-weight:500}.notice{background:#fff1f4;color:#943149}.good{background:#edf7f1;color:#296245}.counter,.tiny,.sliderline{color:#70707c}.danger{color:#8b3856;min-height:40px}.auth-link{color:#a72a52}.auth-card h2{font-weight:750}.auth-card .field small{font-size:12px}
.profilehero{background:radial-gradient(ellipse at 20% 15%,#995169,transparent 65%),linear-gradient(140deg,#3c3448,#22222e);border-radius:20px 20px 0 0;height:350px}.avatar{font-size:84px;font-weight:650;letter-spacing:-4px;text-shadow:none;color:#ffffffde}.profileoverlay{background:linear-gradient(transparent,#191821ed)}.profilecontent h2{font-size:32px;letter-spacing:-1px;color:white;font-weight:750}.profilemeta{font-size:13px}.score{font-size:12px;font-weight:650;color:#4b3545;background:#fffffff0;padding:9px 12px}.profilebody>p{font-size:15px;line-height:1.6}.profilebody .actions{gap:12px}.profilebody .counter{font-size:11px;margin-top:15px}.miniavatar,.matches-card .miniavatar,.chat-avatar{border-radius:50%;background:#f7e8ee;color:#95435e;font-weight:600}.matchrow{border-color:var(--tm-line);gap:12px}.matchrow .grow{min-width:0}.matchrow b{font-size:16px;font-weight:700}.matchrow small{font-size:12px;line-height:1.5}.matchrow .iconbtn{border:0;background:#fcecf1;color:#a62a50;font-weight:650;padding:10px 17px}.bottomnav{border-color:var(--tm-line);background:#ffffffed}.bottomnav button{font-size:10px;font-weight:600;color:#72717e;min-height:51px;border-radius:15px}.bottomnav button[aria-current=page]{background:#fff0f4;color:#b92a56}.bottomnav svg{stroke-width:1.7}.bottomnav button b{margin-bottom:4px}
.chat-shell{color:var(--tm-ink)}.chat-header,.chat-composer-area{border-color:var(--tm-line)}.chat-person h3,.chat-back,.emptychat h4{color:var(--tm-ink)}.chat-shell .bubble{background:#f1f0f5;color:#35303b}.chat-shell .mine .bubble,.chat-shell .sendbtn{background:var(--tm-gradient);color:white}.chat-shell .sendbtn:disabled{background:#efedf2;color:#a39aa6}.chat-shell .composer{border-color:#dedbe4}.composer:focus-within{border-color:#bd6281;box-shadow:none}.chat-city,.msgtime,.chat-note,.chat-wordmark{color:#77707e}.chat-shell .msgtime{color:#77707e}.paywall .crown{display:grid;place-items:center;margin:4px auto 20px;width:70px;height:70px;border-radius:22px;font-size:34px;color:#c32c59;background:#fff0f4}.paywall h1{font-size:42px;letter-spacing:-1.5px}.paywall .summary{padding:18px}.paywall .summary .muted{line-height:2}.match-symbol{display:flex;align-items:center;justify-content:center;margin:6px auto 26px;width:80px;height:70px;position:relative}.match-symbol:before,.match-symbol:after{content:"";position:absolute;width:43px;height:43px;border:3px solid #ca315a;border-radius:50%}.match-symbol:before{left:4px}.match-symbol:after{right:4px;border-color:#e96562}.empty-symbol{font-size:37px;font-weight:400;color:#bc305a;margin:8px 0 20px}.funpill{background:#fff0f4;color:#a92c54;border-color:#f3cbd8;font-weight:600}.progress{background:#efedf2}.progress i{background:var(--tm-gradient)}.membername,.sectiontitle,.matchitem .place{font-weight:650}.stat strong{color:#bf2a55}.resultitem,.matchitem{border-color:var(--tm-line)}button:focus-visible{outline:3px solid #d97091;outline-offset:3px}
@media(max-width:560px){.profilehero{height:330px}.card{padding:22px}.profilecontent h2{font-size:30px}.profilebody .summary{margin-top:14px}.auth-card h2{font-size:30px}.chat-shell{border-radius:0}.paywall h1{font-size:38px}}

</style>

async function ensureUser(){
  if(currentUser) return currentUser;
  const {data:{session}} = await db.auth.getSession();
  if(session?.user){
    currentUser = session.user;
    return currentUser;
  }
  const {data,error} = await db.auth.signInAnonymously();
  if(error) throw error;
  currentUser = data.user || data.session?.user;
  return currentUser;
}

function whyItFits(d){
  const p=trip?parsePrefs(trip.preferences):{};
  const chosen=p.vibes||[];
  const overlap=d.vibes.filter(v=>chosen.includes(v));
  if(overlap.length) return `Matches your ${overlap.slice(0,3).join(" + ")} vibe`;
  if(p.weather&&p.weather!=="Any"&&d.temp===p.weather) return `Fits your ${p.weather.toLowerCase()} weather pick`;
  return `A strong ${d.vibes.slice(0,2).join(" + ")} option`;
}


function budgetMax(label){
  if(label==="Under €500")return 500;
  if(label==="€500–€1,000")return 1000;
  if(label==="€1,000–€1,500")return 1500;
  return 99999;
}

function parsePrefs(value){try{return value?JSON.parse(value):{};}catch(e){return {};}}

function rankedDestinations(prefs){
  const max=budgetMax(prefs.budget||"€1,500+");
  let list=DESTINATIONS.filter(d=>d.price<=max);
  if(prefs.weather&&prefs.weather!=="Any"){const w=list.filter(d=>d.temp===prefs.weather); if(w.length>=3)list=w;}
  const vibes=prefs.vibes||[];
  if(vibes.length){
    list=list.map(d=>({...d,score:d.vibes.filter(v=>vibes.includes(v)).length})).sort((a,b)=>b.score-a.score||a.price-b.price);
    const matches=list.filter(d=>d.score>0);
    if(matches.length>=3)list=matches;
  }
  return list.length?list:DESTINATIONS.slice(0,5);
}

async function createTrip(){

    await ensureUser();

    const title=document.getElementById("tripTitle").value.trim();
    const owner=document.getElementById("ownerName").value.trim();

    const budget=document.getElementById("budget").value;
    const prefs={
      startDate:document.getElementById("startDate").value,
      endDate:document.getElementById("endDate").value,
      budget,
      vibes:selectedVibes,
      weather:document.getElementById("weather").value
    };

    if(!title||!owner){
      alert("Add a trip name and your name.");
      return;
    }

    const code=Math.random().toString(36).slice(2,8).toUpperCase();

    const {data,error}=await db.from(TRIP_TABLE).insert({
      code,
      title,
      owner,
      origin:origin||null,
      budget,
      preferences:JSON.stringify(prefs),
      owner_user_id:currentUser.id
    }).select().single();

    if(error) throw error;

    trip=data;
    travelerName=owner;
    filteredDestinations=rankedDestinations(prefs);

    const {error:memberError}=await db.from(MEMBER_TABLE).insert({
      trip_code:code,
      name:owner,
      user_id:currentUser.id
    });

    if(memberError) throw memberError;

    showInvite();
  }catch(err){
    alert("Could not create trip: "+err.message);
  }
}

function bindSwipeGesture(){
  const card=document.getElementById("swipeCard");
  const likeStamp=document.getElementById("likeStamp");
  const passStamp=document.getElementById("passStamp");
  if(!card) return;

  let active=false,startX=0,startY=0,dx=0,axis=null;

  const start=(x,y)=>{
    if(swipeAnimating) return;
    active=true; startX=x; startY=y; dx=0; axis=null;
    card.style.transition="none";
  };

  const move=(x,y)=>{
    if(!active || swipeAnimating) return false;
    const moveX=x-startX;
    const moveY=y-startY;
    if(!axis && (Math.abs(moveX)>5 || Math.abs(moveY)>5)){
      axis=Math.abs(moveX)>=Math.abs(moveY)*0.8?"x":"y";
    }
    if(axis!=="x") return false;

    dx=moveX;
    const rotate=Math.max(-14,Math.min(14,dx/14));
    card.style.transform=`translate3d(${dx}px,0,0) rotate(${rotate}deg)`;
    const strength=Math.min(1,Math.abs(dx)/90);
    if(dx>0){
      if(likeStamp) likeStamp.style.opacity=String(strength);
      if(passStamp) passStamp.style.opacity="0";
    }else{
      if(passStamp) passStamp.style.opacity=String(strength);
      if(likeStamp) likeStamp.style.opacity="0";
    }
    return true;
  };

  const reset=()=>{
    card.style.transition="transform .22s ease, opacity .22s ease";
    card.style.transform="translate3d(0,0,0) rotate(0deg)";
    card.style.opacity="1";
    if(likeStamp) likeStamp.style.opacity="0";
    if(passStamp) passStamp.style.opacity="0";
  };

  const finish=()=>{
    if(!active) return;
    active=false;
    if(axis==="x" && Math.abs(dx)>=55){
      swipeChoice(dx>0);
    }else{
      reset();
    }
  };

  // iPhone / iPad: explicit touch events are more reliable than pointer events.
  card.addEventListener("touchstart",e=>{
    if(e.target.closest("button") || e.touches.length!==1) return;
    const t=e.touches[0];
    start(t.clientX,t.clientY);
  },{passive:true});

  card.addEventListener("touchmove",e=>{
    if(!active || e.touches.length!==1) return;
    const t=e.touches[0];
    if(move(t.clientX,t.clientY)) e.preventDefault();
  },{passive:false});

  card.addEventListener("touchend",finish,{passive:true});
  card.addEventListener("touchcancel",()=>{active=false;reset();},{passive:true});

  // Desktop / trackpad fallback.
  card.addEventListener("mousedown",e=>{
    if(e.target.closest("button")) return;
    e.preventDefault();
    start(e.clientX,e.clientY);
  });
  window.addEventListener("mousemove",e=>{
    if(active) move(e.clientX,e.clientY);
  });
  window.addEventListener("mouseup",()=>{
    if(active) finish();
  });
}

function swipeChoice(yes){
  if(swipeAnimating) return;
  const card=document.getElementById("swipeCard");
  if(!card){vote(yes);return;}

  swipeAnimating=true;
  const direction=yes?1:-1;
  card.style.transition="transform .2s ease-out, opacity .2s ease-out";
  card.style.transform=`translateX(${direction*Math.max(window.innerWidth,500)}px) rotate(${direction*16}deg)`;
  card.style.opacity="0";
  setTimeout(()=>{
    swipeAnimating=false;
    vote(yes);
  },190);
}

function vote(yes){
  if(yes)likes.push(filteredDestinations[idx].name);
  idx++;
  swipe();
}

async function submitVotes(){
  try{
    await ensureUser();

    app().innerHTML=`<div class="card"><h2>Saving your swipes…</h2><p class="muted">Checking for a group match.</p></div>`;

    const {error:deleteError}=await db.from(VOTE_TABLE)
      .delete()
      .eq("trip_code",trip.code)
      .eq("user_id",currentUser.id);

    if(deleteError) throw deleteError;

    if(likes.length){
      const rows=likes.map(destination=>({
        trip_code:trip.code,
        member_name:travelerName,
        destination,
        user_id:currentUser.id
      }));

      const {error}=await db.from(VOTE_TABLE).insert(rows);
      if(error) throw error;
    }

    resultsRefreshAttempts=0;
    await new Promise(r=>setTimeout(r,700));
    await results();
  }catch(err){
    alert("Could not save votes: "+err.message);
  }
}

async function results(options={}){
  if(!options.silent) app().innerHTML=`<div class="card match"><div class="big">🔎</div><h2>Checking group results…</h2><p class="muted">Looking for shared destinations.</p></div>`;

  const [memberRes,voteRes]=await Promise.all([
    db.from(MEMBER_TABLE).select("*").eq("trip_code",trip.code),
    db.from(VOTE_TABLE).select("*").eq("trip_code",trip.code)
  ]);

  if(memberRes.error||voteRes.error){
    alert("Could not load results.");
    return;
  }

  const rawMembers=memberRes.data||[];
  const votes=voteRes.data||[];

  // One traveler per anonymous user ID. Older rows without IDs fall back to their name.
  const memberMap=new Map();
  rawMembers.forEach(m=>{
    const key=m.user_id||`name:${m.name}`;
    if(!memberMap.has(key)) memberMap.set(key,m);
  });
  const members=[...memberMap.values()];
  const names=members.map(x=>x.name);
  const memberCount=members.length;

  const counts={};
  const voters=new Set();
  votes.forEach(v=>{
    const voter=v.user_id||`name:${v.member_name}`;
    voters.add(voter);
    if(!counts[v.destination]) counts[v.destination]=new Set();
    counts[v.destination].add(voter);
  });

  const ranking=Object.entries(counts)
    .map(([destination,set])=>({destination,count:set.size}))
    .sort((a,b)=>b.count-a.count || a.destination.localeCompare(b.destination));

  const matches=ranking.filter(x=>memberCount>1&&x.count===memberCount);
  const status=`${Math.min(voters.size,memberCount)} of ${memberCount} traveler${memberCount===1?"":"s"} have liked at least one destination.`;

  if(matches.length){
    const primary=DESTINATIONS.find(x=>x.name===matches[0].destination)||{emoji:"✈️",name:matches[0].destination};
    const allMatches=matches.map(m=>{
      const d=DESTINATIONS.find(x=>x.name===m.destination)||{emoji:"✈️",name:m.destination,country:""};
      return `<div class="matchitem"><div class="place">${d.emoji} ${esc(d.name)}</div><div class="resultmeta">Everyone matched${d.country?` · ${esc(d.country)}`:""}</div></div>`;
    }).join("");

    app().innerHTML=`
    <div class="card match">
      <div class="big">🎉</div>
      <div class="eyebrow">It's a TripMatch</div>
      <h1>${primary.emoji} ${esc(primary.name)}</h1>
      <p class="muted">Everyone in the group liked this destination.</p>
      <div class="people">${names.map(n=>`<span class="person">✓ ${esc(n)}</span>`).join("")}</div>
      ${matches.length>1?`<div class="summary"><b>You have ${matches.length} matches</b><span class="muted">Here are all the places everyone liked.</span></div><div class="matchlist">${allMatches}</div>`:""}
      <div class="statusline">${esc(status)}</div>
      <button class="primary" onclick="shareInvite()">Share trip</button>
      <button class="secondary" style="margin-top:10px" onclick="resultsRefreshAttempts=0;results()">Refresh results</button>
      <button class="secondary" style="margin-top:10px" onclick="showDashboard()">Trip dashboard</button>
       <button class="secondary" style="margin-top:10px" onclick="restartSwipes()">Swipe again</button>
    </div>`;
    if(options.auto || resultsRefreshAttempts===0) scheduleResultsRefresh();
  }else{
    const near=ranking.slice(0,3).map(r=>{
      const d=DESTINATIONS.find(x=>x.name===r.destination)||{emoji:"✈️",name:r.destination};
      return `<div class="resultitem"><div><strong>${d.emoji} ${esc(d.name)}</strong><div class="resultmeta">Liked by ${r.count} of ${memberCount}</div></div><span class="person">${r.count}/${memberCount}</span></div>`;
    }).join("");

    app().innerHTML=`
    <div class="card match">
      <div class="big">✈️</div>
      <h2>${memberCount<2?"Your swipes are in!":"No full-group match yet"}</h2>
      <p class="muted">${memberCount<2
        ?"Invite someone else. A match appears when at least two travelers like the same destination."
        :"Someone may still need to finish swiping, or the group chose different places."}</p>
      <div class="people">${names.map(n=>`<span class="person">${esc(n)}</span>`).join("")}</div>
      <div class="statusline">${esc(status)}</div>
      ${near?`<div class="summary"><b>Closest group picks</b><span class="muted">These are the destinations with the most likes so far.</span></div><div class="resultgrid">${near}</div>`:""}
      <button class="primary" onclick="shareInvite()">Share invite</button>
      <button class="secondary" style="margin-top:10px" onclick="resultsRefreshAttempts=0;results()">Refresh results</button>
       <button class="secondary" style="margin-top:10px" onclick="showDashboard()">Trip dashboard</button>
    </div>`;
    if(options.auto || resultsRefreshAttempts===0) scheduleResultsRefresh();
  }
}

function restartSwipes(){idx=0;likes=[];swipe();}

const APP_VERSION="10";
try{
  const seen=sessionStorage.getItem("tripmatch_app_version");
  if(seen!==APP_VERSION){
    sessionStorage.setItem("tripmatch_app_version",APP_VERSION);
    if(seen) location.reload();
  }
}catch(e){}

async function boot(){
  app().innerHTML=`<div class="card"><h2>Starting TripMatch…</h2><p class="muted">Creating your anonymous session.</p></div>`;
  try{
    await ensureUser();
    const params=new URLSearchParams(location.search);
    const codeFromLink=params.get("trip");
    codeFromLink?inviteLanding(codeFromLink):home();
  }catch(err){
    app().innerHTML=`<div class="card"><h2>Could not start TripMatch</h2><p class="muted">${esc(err.message)}</p></div>`;
  }
}

boot();
</script>
</body>
</html>
