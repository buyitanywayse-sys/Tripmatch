<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf7">
<title>TripMatch — Find your travel people</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fffaf7;--card:#fff;--ink:#17212b;--muted:#68727b;--line:#eee1da;--accent:#ff5961;--soft:#fff0ed}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:760px;margin:auto;padding:18px 18px 92px}.nav{display:flex;justify-content:space-between;align-items:center;padding:7px 0 16px}
.brand{font-size:26px;font-weight:950;letter-spacing:-1.2px}.brand span{color:var(--accent)}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 55px #2b201b12;margin:13px 0}.eyebrow{font-size:12px;letter-spacing:1.25px;text-transform:uppercase;font-weight:900;color:var(--accent)}
h1{font-size:43px;line-height:1;letter-spacing:-2.6px;margin:11px 0 15px}h2{font-size:29px;line-height:1.08;letter-spacing:-1.5px;margin:8px 0 12px}.muted{color:var(--muted);line-height:1.5}
.primary,.secondary{width:100%;padding:15px 16px;border-radius:15px;font-weight:900}.primary{border:0;background:var(--accent);color:#fff;box-shadow:0 10px 25px #ff59612c}.secondary{border:1px solid #ddd0c9;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd0c9;border-radius:14px;padding:13px;background:#fff;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #ddd0c9;background:#fff;border-radius:999px;padding:9px 12px;font-weight:750}.tag.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.summary{background:#faf6f3;border-radius:16px;padding:14px;margin:13px 0}.notice{padding:13px;border-radius:14px;background:#fff1ee;color:#8f3d43;font-size:13px;line-height:1.45;margin:13px 0}.good{padding:13px;border-radius:14px;background:#eef9f2;color:#25613c;font-size:13px;margin:13px 0}
.profilehero{height:420px;border-radius:25px;background:linear-gradient(145deg,#ffe7df,#f3e6ff);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:22px}.avatar{position:absolute;inset:0;display:grid;place-items:center;font-size:112px;font-weight:950;color:#fff;text-shadow:0 8px 35px #0002}.profileoverlay{position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#17212be8)}.profilecontent{position:relative;color:#fff;width:100%;z-index:2}.profilecontent h2{font-size:36px;margin:0 0 5px;color:#fff}.profilemeta{font-size:14px;opacity:.92}.score{position:absolute;right:17px;top:17px;z-index:3;background:#fffffff2;color:var(--ink);padding:10px 12px;border-radius:999px;font-weight:950}
.profilebody{padding:19px 0 0}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{font-size:12px;padding:7px 9px;border-radius:999px;background:#f5efec}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.pass{border:1px solid #ddd0c9;background:#fff;color:#8d4348;border-radius:16px;padding:15px;font-weight:900}.like{border:0;background:var(--accent);color:#fff;border-radius:16px;padding:15px;font-weight:900}.counter{text-align:center;font-size:12px;color:#8b9298;margin:11px 0}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}.bottomnav button{border:0;background:transparent;padding:8px 5px;color:#747d85;font-size:11px;font-weight:800}.bottomnav button b{display:block;font-size:21px;line-height:1.1;margin-bottom:2px}
.matchrow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #f0e6e0}.matchrow:last-child{border-bottom:0}.miniavatar{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,#ffe7df,#f3e6ff);display:grid;place-items:center;font-size:22px;font-weight:950}.matchrow .grow{flex:1}.matchrow small{color:var(--muted)}.paywall{text-align:center}.crown{font-size:54px}.tiny{font-size:12px;color:#8b9298;text-align:center;margin:21px 0}.sliderline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}.danger{border:0;background:transparent;color:#a94e54;padding:8px;font-size:12px;text-decoration:underline}
@media(max-width:560px){h1{font-size:39px}.row{grid-template-columns:1fr}.profilehero{height:390px}}
</style>
</head>
<body>
<div class="wrap"><div class="nav"><div class="brand">Trip<span>Match</span></div><button class="iconbtn" onclick="showPlus()">✦ Plus</button></div><div id="app"></div></div>
<div class="bottomnav" id="bottomnav" style="display:none">
<button onclick="discover()"><b>🧭</b>Discover</button><button onclick="showMatches()"><b>💞</b>Matches</button><button onclick="groupMode()"><b>✈️</b>Group trip</button><button onclick="profileScreen()"><b>👤</b>Profile</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://grjeliceompgijgcsrvt.supabase.co","sb_publishable_6sKOKMtEAqOWlo6y8PoTEA_VGoFtSUX");
const PROFILE_TABLE="traveler_profiles",LIKE_TABLE="traveler_likes",MATCH_TABLE="traveler_matches",BLOCK_TABLE="traveler_blocks",REPORT_TABLE="traveler_reports";
let currentUser=null,myProfile=null,deck=[],deckIndex=0,passed=new Set(),selectedVibes=[],selectedDestinations=[];
const CITIES={"Malmö":{lat:55.605,lng:13.003},"Copenhagen":{lat:55.676,lng:12.568},"Gothenburg":{lat:57.708,lng:11.974},"Stockholm":{lat:59.329,lng:18.069},"Oslo":{lat:59.913,lng:10.752},"Berlin":{lat:52.520,lng:13.405},"Amsterdam":{lat:52.367,lng:4.904},"London":{lat:51.507,lng:-0.128},"Paris":{lat:48.857,lng:2.352},"Barcelona":{lat:41.387,lng:2.170},"Madrid":{lat:40.417,lng:-3.704},"Rome":{lat:41.903,lng:12.496},"Athens":{lat:37.984,lng:23.728},"Lisbon":{lat:38.722,lng:-9.139},"Prague":{lat:50.075,lng:14.438},"Budapest":{lat:47.498,lng:19.040}};
const VIBES=["Beach","City","Food","Nightlife","Culture","Nature","Adventure","Romance","Luxury","Backpacking"];
const DESTS=["Mallorca","Lisbon","Sicily","Santorini","Split","Barcelona","Crete","Prague","Madeira","Rome","Paris","Amsterdam","Mykonos","Corfu","Malta","Ibiza","Tenerife","Istanbul"];
const LOOKING=["Travel buddy","Weekend trips","Group trips","Backpacking","Luxury trips","Girls trips","Digital nomad buddy"];
const app=()=>document.getElementById("app");
const esc=(s="")=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
const parseArr=v=>{try{const a=JSON.parse(v||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}};
const initials=n=>(n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();

async function ensureUser(){if(currentUser)return currentUser;const {data:{session}}=await db.auth.getSession();if(session?.user){currentUser=session.user;return currentUser;}const {data,error}=await db.auth.signInAnonymously();if(error)throw error;currentUser=data.user||data.session?.user;return currentUser;}
function nav(on=true){document.getElementById("bottomnav").style.display=on?"grid":"none";}
async function loadMyProfile(){await ensureUser();const {data,error}=await db.from(PROFILE_TABLE).select("*").eq("user_id",currentUser.id).maybeSingle();if(error)throw error;myProfile=data||null;return myProfile;}
async function boot(){app().innerHTML=`<div class="card"><h2>Starting TripMatch…</h2><p class="muted">Creating your private travel profile session.</p></div>`;try{await ensureUser();await loadMyProfile();if(myProfile){nav(true);discover();}else{nav(false);welcome();}}catch(err){app().innerHTML=`<div class="card"><h2>One setup step left</h2><p class="muted">${esc(err.message)}</p><div class="notice">Run the TripMatch Social SQL setup in Supabase first, then refresh this page.</div></div>`;}}
function welcome(){app().innerHTML=`<div class="card"><div class="eyebrow">Travel buddy matching</div><h1>Find people you'd actually travel well with.</h1><p class="muted">Match with travelers based on destination dreams, travel style, budget and how close they are to you.</p><div class="summary"><b>Free includes</b><span class="muted">100 likes per day · Distance matching · Mutual matches · Group Trip mode</span></div><button class="primary" onclick="profileForm()">Create my profile →</button><button class="secondary" style="margin-top:10px" onclick="groupMode()">Use Group Trip instead</button></div><div class="tiny">18+ only · Your exact location is never shown</div>`;}
function cityOptions(selected=""){return Object.keys(CITIES).map(c=>`<option ${c===selected?"selected":""}>${c}</option>`).join("");}
function profileForm(){const p=myProfile||{};selectedVibes=parseArr(p.vibes);selectedDestinations=parseArr(p.destinations);app().innerHTML=`<div class="card"><div class="eyebrow">${myProfile?"Edit profile":"Create profile"}</div><h2>Tell future travel buddies about you</h2>
<div class="row"><div class="field"><label>First name</label><input id="name" maxlength="50" value="${esc(p.display_name||"")}" placeholder="Frida"></div><div class="field"><label>Age</label><input id="age" type="number" min="18" max="99" value="${p.age||""}" placeholder="29"></div></div>
<div class="field"><label>Home city</label><select id="city">${cityOptions(p.city||"Malmö")}</select><div class="sliderline"><span>City-level location only</span><span>Not your exact address</span></div></div>
<div class="field"><label>Bio</label><textarea id="bio" maxlength="280" placeholder="Beach days, good food and spontaneous weekend trips.">${esc(p.bio||"")}</textarea></div>
<div class="field"><label>Languages</label><input id="languages" maxlength="100" value="${esc(p.languages||"")}" placeholder="English, Greek, Swedish"></div>
<div class="field"><label>Looking for</label><select id="looking">${LOOKING.map(x=>`<option ${x===(p.looking_for||"Travel buddy")?"selected":""}>${x}</option>`).join("")}</select></div>
<div class="field"><label>Budget style</label><select id="budget">${["€","€€","€€€"].map(x=>`<option ${x===(p.budget||"€€")?"selected":""}>${x}</option>`).join("")}</select></div>
<div class="field"><label>Your travel vibe</label><div class="tags">${VIBES.map(v=>`<button type="button" class="tag ${selectedVibes.includes(v)?"on":""}" onclick="toggleChoice(this,'vibe','${v}')">${v}</button>`).join("")}</div></div>
<div class="field"><label>Dream destinations</label><div class="tags">${DESTS.map(v=>`<button type="button" class="tag ${selectedDestinations.includes(v)?"on":""}" onclick="toggleChoice(this,'dest','${v}')">${v}</button>`).join("")}</div></div>
<div class="field"><label>Match distance: <b id="distLabel">${p.distance_km||100} km</b></label><input id="distance" type="range" min="10" max="500" step="10" value="${p.distance_km||100}" oninput="document.getElementById('distLabel').textContent=this.value+' km'"></div>
<div class="row"><div class="field"><label>Min age</label><input id="minAge" type="number" min="18" max="99" value="${p.min_age||18}"></div><div class="field"><label>Max age</label><input id="maxAge" type="number" min="18" max="99" value="${p.max_age||45}"></div></div>
<button class="primary" onclick="saveProfile()">Save profile →</button></div>`;}
function toggleChoice(btn,type,value){const arr=type==="vibe"?selectedVibes:selectedDestinations;const i=arr.indexOf(value);if(i>=0)arr.splice(i,1);else arr.push(value);btn.classList.toggle("on");}
async function saveProfile(){const name=document.getElementById("name").value.trim(),age=+document.getElementById("age").value,city=document.getElementById("city").value,c=CITIES[city],minAge=+document.getElementById("minAge").value,maxAge=+document.getElementById("maxAge").value;if(!name||age<18){alert("Add your name and make sure age is 18+.");return;}if(minAge>maxAge){alert("Minimum age can't be higher than maximum age.");return;}if(selectedVibes.length<1){alert("Choose at least one travel vibe.");return;}const row={user_id:currentUser.id,display_name:name,age,bio:document.getElementById("bio").value.trim(),city,lat:c.lat,lng:c.lng,distance_km:+document.getElementById("distance").value,min_age:minAge,max_age:maxAge,vibes:JSON.stringify(selectedVibes),destinations:JSON.stringify(selectedDestinations),looking_for:document.getElementById("looking").value,languages:document.getElementById("languages").value.trim(),budget:document.getElementById("budget").value};const {data,error}=await db.from(PROFILE_TABLE).upsert(row).select().single();if(error){alert("Could not save profile: "+error.message);return;}myProfile=data;nav(true);discover();}
function haversine(a,b){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng);const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function compat(other){const myV=parseArr(myProfile.vibes),theirV=parseArr(other.vibes),myD=parseArr(myProfile.destinations),theirD=parseArr(other.destinations);const commonV=myV.filter(x=>theirV.includes(x)).length,commonD=myD.filter(x=>theirD.includes(x)).length;let score=35*Math.min(1,commonV/3)+35*Math.min(1,commonD/2);if(myProfile.budget===other.budget)score+=15;if(myProfile.looking_for===other.looking_for)score+=15;return Math.max(35,Math.min(99,Math.round(score)));}
function effectiveLoc(){if(myProfile?.is_plus&&myProfile.travel_mode_lat!=null)return{lat:myProfile.travel_mode_lat,lng:myProfile.travel_mode_lng,city:myProfile.travel_mode_city};return{lat:myProfile.lat,lng:myProfile.lng,city:myProfile.city};}
async function likesToday(){const start=new Date();start.setHours(0,0,0,0);const {data,error}=await db.from(LIKE_TABLE).select("id").eq("liker_user_id",currentUser.id).gte("created_at",start.toISOString());return error?0:(data||[]).length;}
async function discover(){if(!myProfile){profileForm();return;}nav(true);app().innerHTML=`<div class="card"><h2>Finding travelers…</h2><p class="muted">Checking distance and travel compatibility.</p></div>`;const [profilesRes,likesRes,blocksRes]=await Promise.all([db.from(PROFILE_TABLE).select("*").neq("user_id",currentUser.id),db.from(LIKE_TABLE).select("liked_user_id").eq("liker_user_id",currentUser.id),db.from(BLOCK_TABLE).select("blocked_user_id").eq("blocker_user_id",currentUser.id)]);if(profilesRes.error){app().innerHTML=`<div class="card"><h2>Could not load travelers</h2><p class="muted">${esc(profilesRes.error.message)}</p></div>`;return;}const liked=new Set((likesRes.data||[]).map(x=>x.liked_user_id)),blocked=new Set((blocksRes.data||[]).map(x=>x.blocked_user_id)),loc=effectiveLoc();deck=(profilesRes.data||[]).map(p=>({...p,_distance:Math.round(haversine(loc,p)),_score:compat(p)})).filter(p=>!liked.has(p.user_id)&&!blocked.has(p.user_id)&&!passed.has(p.user_id)&&p.age>=myProfile.min_age&&p.age<=myProfile.max_age&&p._distance<=myProfile.distance_km).sort((a,b)=>b._score-a._score||a._distance-b._distance);deckIndex=0;showCard();}
async function showCard(){const used=await likesToday(),remaining=myProfile.is_plus?"∞":Math.max(0,100-used);if(deckIndex>=deck.length){app().innerHTML=`<div class="card" style="text-align:center"><div style="font-size:55px">🌍</div><h2>No more travelers in this range</h2><p class="muted">Try increasing your distance, changing age range, or check back when more people join.</p><button class="primary" onclick="profileScreen()">Change discovery settings</button><button class="secondary" style="margin-top:10px" onclick="discover()">Refresh people</button></div>`;return;}const p=deck[deckIndex],vibes=parseArr(p.vibes),dests=parseArr(p.destinations);app().innerHTML=`<div class="card" style="padding:0;overflow:hidden"><div class="profilehero"><div class="avatar">${esc(initials(p.display_name))}</div><div class="profileoverlay"></div><div class="score">${p._score}% match</div><div class="profilecontent"><h2>${esc(p.display_name)}, ${p.age}</h2><div class="profilemeta">📍 ${esc(p.city)} · ${p._distance} km away</div></div></div><div class="profilebody" style="padding:20px"><p>${esc(p.bio||"Ready for the next trip.")}</p><div class="chips">${vibes.slice(0,5).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><div class="summary"><b>Wants to go</b><span class="muted">${dests.length?esc(dests.slice(0,5).join(" · ")):"Open to ideas"}<br>${esc(p.looking_for)} · Budget ${esc(p.budget)}</span></div>${p.languages?`<p class="muted">Languages: ${esc(p.languages)}</p>`:""}<div class="actions"><button class="pass" onclick="passPerson()">✕ Pass</button><button class="like" onclick="likePerson()">♥ Like</button></div><div class="counter">${myProfile.is_plus?"Unlimited likes":remaining+" of 100 free likes left today"}</div><div style="text-align:center"><button class="danger" onclick="reportPerson()">Report</button><button class="danger" onclick="blockPerson()">Block</button></div></div></div>`;}
function passPerson(){if(deck[deckIndex])passed.add(deck[deckIndex].user_id);deckIndex++;showCard();}
async function likePerson(){const p=deck[deckIndex];if(!p)return;const used=await likesToday();if(!myProfile.is_plus&&used>=100){showPlus("You've used today's 100 free likes.");return;}const {error}=await db.from(LIKE_TABLE).insert({liker_user_id:currentUser.id,liked_user_id:p.user_id});if(error&&!String(error.message).toLowerCase().includes("duplicate")){alert("Could not save like: "+error.message);return;}const {data:matched}=await db.rpc("tripmatch_make_match",{p_other_user:p.user_id});if(matched){showMatch(p);return;}deckIndex++;showCard();}
function showMatch(p){app().innerHTML=`<div class="card" style="text-align:center"><div style="font-size:65px">🎉</div><div class="eyebrow">It's a TripMatch</div><h1>${esc(myProfile.display_name)} + ${esc(p.display_name)}</h1><p class="muted">You both liked each other. Start planning the trip instead of another group chat debate.</p><div class="good">Chat is the next feature we'll connect. For now this match is saved in your Matches tab.</div><button class="primary" onclick="showMatches()">See my matches</button><button class="secondary" style="margin-top:10px" onclick="deckIndex++;showCard()">Keep discovering</button></div>`;}
async function showMatches(){if(!myProfile)return profileForm();nav(true);const {data,error}=await db.from(MATCH_TABLE).select("*").or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`).order("created_at",{ascending:false});if(error){alert(error.message);return;}const ids=(data||[]).map(m=>m.user_a===currentUser.id?m.user_b:m.user_a);let profiles=[];if(ids.length){const r=await db.from(PROFILE_TABLE).select("*").in("user_id",ids);profiles=r.data||[];}const byId=new Map(profiles.map(p=>[p.user_id,p]));app().innerHTML=`<div class="card"><div class="eyebrow">Your matches</div><h2>Travel people you matched with</h2>${ids.length?ids.map(id=>{const p=byId.get(id);if(!p)return"";return `<div class="matchrow"><div class="miniavatar">${esc(initials(p.display_name))}</div><div class="grow"><b>${esc(p.display_name)}, ${p.age}</b><br><small>${esc(p.city)} · ${esc(p.looking_for)}</small></div><button class="iconbtn" onclick="alert('Chat is coming next 💬')">💬</button></div>`;}).join(""):`<div class="summary">No matches yet. Your next travel person might be one Like away.</div>`}</div>`;}
function profileScreen(){if(!myProfile)return profileForm();nav(true);const travel=myProfile.travel_mode_city?`Travel Mode: ${esc(myProfile.travel_mode_city)}`:"Travel Mode off";app().innerHTML=`<div class="card"><div class="eyebrow">Your profile</div><h2>${esc(myProfile.display_name)}, ${myProfile.age}</h2><div class="summary"><b>📍 ${esc(myProfile.city)}</b><span class="muted">Matching within ${myProfile.distance_km} km · Ages ${myProfile.min_age}–${myProfile.max_age}<br>${travel}</span></div><button class="primary" onclick="profileForm()">Edit profile & filters</button><button class="secondary" style="margin-top:10px" onclick="travelMode()">✈️ Change discovery location</button><button class="secondary" style="margin-top:10px" onclick="groupMode()">👥 Group Trip mode</button></div>`;}
function travelMode(){if(!myProfile?.is_plus){showPlus("Travel Mode lets you match from another city before you arrive.");return;}app().innerHTML=`<div class="card"><div class="eyebrow">Travel Mode</div><h2>Match from another city</h2><div class="field"><label>Discovery city</label><select id="travelCity">${cityOptions(myProfile.travel_mode_city||myProfile.city)}</select></div><button class="primary" onclick="saveTravelMode()">Use this city</button></div>`;}
async function saveTravelMode(){const city=document.getElementById("travelCity").value,c=CITIES[city];const {data,error}=await db.from(PROFILE_TABLE).update({travel_mode_city:city,travel_mode_lat:c.lat,travel_mode_lng:c.lng}).eq("user_id",currentUser.id).select().single();if(error){alert(error.message);return;}myProfile=data;discover();}
function showPlus(reason=""){app().innerHTML=`<div class="card paywall"><div class="crown">✦</div><div class="eyebrow">TripMatch+</div><h1>Travel farther.</h1>${reason?`<div class="notice">${esc(reason)}</div>`:""}<div class="summary" style="text-align:left"><b>Plus will include</b><span class="muted">Unlimited likes<br>Travel Mode: change your discovery city<br>See who liked you<br>Undo last pass<br>Priority discovery & profile boosts</span></div><button class="primary" onclick="alert('Payments are the next step. We can connect Stripe after this social matching flow is tested.')">Unlock TripMatch+</button><button class="secondary" style="margin-top:10px" onclick="${myProfile?"discover()":"welcome()"}">Not now</button></div>`;}
async function blockPerson(){const p=deck[deckIndex];if(!p)return;if(!confirm(`Block ${p.display_name}? You won't see each other in discovery.`))return;await db.from(BLOCK_TABLE).insert({blocker_user_id:currentUser.id,blocked_user_id:p.user_id});deckIndex++;showCard();}
async function reportPerson(){const p=deck[deckIndex];if(!p)return;const reason=prompt("Briefly tell us why you're reporting this profile:");if(!reason)return;await db.from(REPORT_TABLE).insert({reporter_user_id:currentUser.id,reported_user_id:p.user_id,reason:reason.slice(0,500)});alert("Report submitted.");deckIndex++;showCard();}
function groupMode(){location.href="group.html";}
boot();
</script>
</body>
</html>
