const app=()=>document.getElementById("app");
const esc=(s="")=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
const parseArr=v=>{try{const a=JSON.parse(v||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}};
const initials=n=>(n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();

async function ensureUser(){if(currentUser)return currentUser;const {data:{session}}=await db.auth.getSession();if(session?.user){currentUser=session.user;return currentUser;}throw new Error("Please create an account or log in to continue.");}
function setActiveNav(index){document.querySelectorAll("#bottomnav>button").forEach((b,i)=>{if(i===index)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});}
function nav(on=true){document.getElementById("bottomnav").style.display=on?"grid":"none";if(on&&currentUser)startUnreadRefresh();else stopUnreadRefresh();}
let screenVersion=0;
function stopChatRefresh(){screenVersion++;if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null;}activeChat=null;document.body.classList.remove("chat-mode","landing-mode","auth-mode","discover-mode");}
async function loadMyProfile(){await ensureUser();const {data,error}=await db.from(PROFILE_TABLE).select("*").eq("user_id",currentUser.id).maybeSingle();if(error)throw error;myProfile=data||null;return myProfile;}
function clearUserState(){stopChatRefresh();stopUnreadRefresh();unreadCounts=new Map();myProfile=null;isModerator=false;deck=[];deckIndex=0;passed=new Set();selectedVibes=[];selectedDestinations=[];savedIds=new Set();savedProfiles=new Map();}
function takeUser(user){if(currentUser?.id!==user?.id)clearUserState();currentUser=user||null;}
function pendingAccount(){try{return JSON.parse(localStorage.getItem('tripmatch_pending_account')||'null')}catch(e){return null}}
function storePending(value){try{if(value)localStorage.setItem('tripmatch_pending_account',JSON.stringify(value));else localStorage.removeItem('tripmatch_pending_account')}catch(e){}}
function cleanAuthUrl(){authIntent='';recoveryRequested=false;try{const u=new URL(location.href);u.searchParams.delete('auth');u.searchParams.delete('error');u.searchParams.delete('error_description');u.hash='';history.replaceState(null,'',u)}catch(e){}}
function authReturn(action){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('auth',action);return u.href;}
function setScreenUrl(view,matchId=null,replace=false){const u=new URL(location.href);u.searchParams.delete('view');u.searchParams.delete('match');if(view!=='discover'){u.searchParams.set('view',view);if(view==='chat'&&matchId!=null)u.searchParams.set('match',String(matchId));}if(u.href===location.href)return;history[replace?'replaceState':'pushState']({tripmatch:true},'',u.href);}
async function restoreScreen(){if(!currentUser||!myProfile)return;const query=new URLSearchParams(location.search),view=query.get('view');if(view==='matches'){await showMatches({updateUrl:false});return;}if(view==='chat'){const id=query.get('match');if(/^\d+$/.test(id||'')){const {data,error}=await db.from(MATCH_TABLE).select('id,user_a,user_b,ended_at').eq('id',id).maybeSingle();if(!error&&data&&!data.ended_at&&(data.user_a===currentUser.id||data.user_b===currentUser.id)){await showChat(id,data.user_a===currentUser.id?data.user_b:data.user_a,{updateUrl:false});return;}}setScreenUrl('matches',null,true);await showMatches({updateUrl:false});return;}if(view==='profile'){profileScreen({updateUrl:false});return;}if(view==='settings'){settingsScreen({updateUrl:false});return;}if(view==='saved'){await showSaved({updateUrl:false});return;}if(view==='moderation'&&isModerator){await moderationScreen({updateUrl:false});return;}await discover({updateUrl:false});}
window.addEventListener('popstate',()=>{if(currentUser&&myProfile)restoreScreen();else boot();});
async function boot(){if(authBooting)return;authBooting=true;try{const {data,error}=await db.auth.getSession();if(error)throw error;takeUser(data.session?.user);if(initialAuthError&&!window.authErrorShown){window.authErrorShown=true;authScreen('login');authMessage('This email link has expired or could not be verified. Request a new link below.');return;}if(recoveryRequested||authIntent==='reset'){if(currentUser&&!currentUser.is_anonymous)passwordScreen(true);else{authScreen('forgot');authMessage('Open the latest password-reset link from your email.');}return;}const pending=pendingAccount();if(currentUser&&!currentUser.is_anonymous&&currentUser.email_confirmed_at&&(authIntent==='finish'||pending?.id===currentUser.id)){passwordScreen(false);return;}cleanAuthUrl();if(!currentUser){nav(false);welcome();return;}await loadMyProfile();if(myProfile){const role=await db.from('tripmatch_moderators').select('user_id').eq('user_id',currentUser.id).maybeSingle();isModerator=!!role.data;if(myProfile.is_suspended){stopChatRefresh();nav(false);app().innerHTML='<div class="card"><h2>Account suspended</h2><p class="muted">Your profile and conversations are unavailable. Contact TripMatch support if you believe this is a mistake.</p></div>';return;}nav(true);await restoreScreen();}else{nav(false);welcome();}}catch(err){nav(false);app().innerHTML=`<div class="card"><h2>Could not open TripMatch</h2><p class="muted">${esc(err.message)}</p><button class="secondary" onclick="boot()">Try again</button></div>`;}finally{authBooting=false;}}
if(db.auth?.onAuthStateChange)db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')recoveryRequested=true;if(event==='INITIAL_SESSION'||authBusy||authBooting)return;const changed=currentUser?.id!==session?.user?.id;if(event==='SIGNED_OUT'||event==='PASSWORD_RECOVERY'||changed||(event==='USER_UPDATED'&&pendingAccount()))setTimeout(()=>boot(),0);});
function authMessage(message,good=false){const el=document.getElementById('authMessage');if(el){el.textContent=message;el.className=good?'good':'notice';}}
function authPanel(title,body){stopChatRefresh();document.body.classList.add("auth-mode");nav(false);app().innerHTML=`<section class="card auth-card"><div class="eyebrow">Your TripMatch account</div><h2>${title}</h2>${body}<div id="authMessage" role="status" aria-live="polite"></div></section>`;}
function authScreen(mode='register'){const guest=!!currentUser?.is_anonymous;const title=mode==='login'?'Welcome back':mode==='forgot'?'Reset your password':guest?'Keep your connections':'Create your account';const needsPassword=mode==='login'||(mode==='register'&&!guest);authPanel(title,`<p class="muted">${mode==='forgot'?'We’ll email you a link to choose a new password.':mode==='login'?'Log in to your profile, matches and conversations.':guest?'Add your email to keep this profile, your matches and your chats. Verify your email, then choose a password.':'Find your travel people. Keep your connections wherever you go.'}</p>${mode==='login'&&guest&&myProfile?`<div class="notice">Logging into another account switches away from this guest profile. To keep these matches and chats, <button class="auth-link" type="button" onclick="authScreen('register')">register this profile first</button>.</div>`:''}<form onsubmit="event.preventDefault();submitAuth('${mode}')"><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required value="${esc(guest?(pendingAccount()?.email||''):'')}"></div>${needsPassword?`<div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" ${mode==='register'?'minlength="8"':''} maxlength="128" required>${mode==='register'?'<small class="muted">At least 8 characters.</small>':''}</div>`:''}${mode==='login'&&guest&&myProfile?'<label class="auth-check"><input id="switchConsent" type="checkbox" required> I understand my guest profile will not transfer to another account.</label>':''}<button id="authSubmit" class="primary" type="submit">${mode==='login'?'Log in':mode==='forgot'?'Send reset link':guest?'Verify my email':'Create account'}</button></form><div class="auth-links">${mode==='login'?`<button class="auth-link" onclick="authScreen('forgot')">Forgot password?</button><button class="auth-link" onclick="authScreen('register')">Create an account</button>`:`<button class="auth-link" onclick="authScreen('login')">Already registered? Log in</button>`}<button class="auth-link" onclick="resumeTripMatch()">${currentUser?'Back to TripMatch':'Back'}</button></div>`);}
async function resumeTripMatch(){if(recoveryRequested)return passwordScreen(true);cleanAuthUrl();if(myProfile)discover();else welcome();}
async function submitAuth(mode){if(authBusy)return;authBusy=true;const button=document.getElementById('authSubmit'),email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword')?.value;button.disabled=true;authMessage('');try{if(mode==='login'){if(currentUser?.is_anonymous&&myProfile&&!document.getElementById('switchConsent')?.checked)throw Error('Confirm that you want to switch accounts.');const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;takeUser(data.user);cleanAuthUrl();await boot();}else if(mode==='forgot'){const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:authReturn('reset')});if(error)throw error;authMessage('If an account exists for this email, a reset link has been requested. Check your inbox and spam folder.',true);}else if(currentUser?.is_anonymous){const id=currentUser.id;const {data,error}=await db.auth.updateUser({email},{emailRedirectTo:authReturn('finish')});if(error)throw error;if(data.user?.id!==id)throw Error('Could not verify your existing profile. Please try again.');storePending({id,email});currentUser=data.user;if(!currentUser.is_anonymous&&currentUser.email_confirmed_at)passwordScreen(false);else verificationScreen(email,true);}else{if(!password||password.length<8)throw Error('Choose a password with at least 8 characters.');const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:authReturn('welcome')}});if(error)throw error;if(data.session){takeUser(data.user);await boot();}else verificationScreen(email,false);}}catch(error){authMessage(error.message||'Please try again.');}finally{authBusy=false;if(button.isConnected)button.disabled=false;}}
function verificationScreen(email,linking){authPanel('Check your email',`<p class="muted">Open the confirmation link sent to <strong>${esc(email)}</strong>. ${linking?'Then choose your password to finish saving this profile.':'Once verified, you can log in and create your travel profile.'}</p><p class="muted">Check your spam folder too. Keep this browser open until you finish.</p><button class="primary" id="authSubmit" onclick="checkEmailConfirmation()">I’ve verified my email</button><div class="auth-links"><button class="auth-link" onclick="authScreen('${linking?'register':'login'}')">${linking?'Change email or request a new link':'Go to login'}</button><button class="auth-link" onclick="resumeTripMatch()">Back to TripMatch</button></div>`);}
async function checkEmailConfirmation(){if(authBusy)return;authBusy=true;try{const {data,error}=await db.auth.getUser();if(error)throw error;takeUser(data.user);if(!currentUser?.email_confirmed_at||currentUser.is_anonymous)throw Error('Please open the confirmation link in your email first.');const {error:refreshError}=await db.auth.refreshSession();if(refreshError)throw refreshError;await boot();}catch(error){authMessage(error.message||'Please open the confirmation email, then log in.');}finally{authBusy=false;}}
function passwordScreen(recovery){authPanel(recovery?'Choose a new password':'Finish your account',`<p class="muted">${recovery?'Set a password you haven’t used before.':'Your email is verified. Add a password to access your profile and chats from another device.'}</p><form onsubmit="event.preventDefault();saveAccountPassword()"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small class="muted">At least 8 characters.</small></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><button id="authSubmit" class="primary" type="submit">Save password</button></form>`);}
async function saveAccountPassword(){if(authBusy)return;const pass=document.getElementById('newPassword').value,confirmPass=document.getElementById('confirmPassword').value;if(pass.length<8||pass!==confirmPass){authMessage('Passwords must match and contain at least 8 characters.');return;}authBusy=true;const b=document.getElementById('authSubmit');b.disabled=true;try{const {data:verified,error:userError}=await db.auth.getUser();if(userError)throw userError;if(!verified.user?.email_confirmed_at||verified.user.is_anonymous)throw Error('Verify your email before setting a password.');const {data,error}=await db.auth.updateUser({password:pass});if(error)throw error;takeUser(data.user);storePending(null);cleanAuthUrl();await loadMyProfile();authPanel('You’re all set',`<p class="muted">Your password is saved. Use your email and password to log in on another device.</p><button class="primary" onclick="resumeTripMatch()">Continue to TripMatch</button>`);}catch(error){authMessage(error.message);}finally{authBusy=false;if(b.isConnected)b.disabled=false;}}
function accountCard(){if(!currentUser)return '';const pending=pendingAccount();if(currentUser.is_anonymous)return `<div class="card account-card"><h3>Keep your connections</h3><p class="muted">Save this profile, your matches and your chats with an email account.</p><button class="primary" onclick="authScreen('register')">Create my account</button><button class="auth-link" onclick="authScreen('login')">Already have an account? Log in</button></div>`;if(pending?.id===currentUser.id)return `<div class="card account-card"><h3>Finish your account</h3><button class="primary" onclick="passwordScreen(false)">Set your password</button></div>`;return `<div class="card account-card"><h3>Your account</h3><p class="muted">${esc(currentUser.email||'')}</p><button class="secondary" onclick="authScreen('forgot')">Reset password</button><button class="auth-link" onclick="signOutAccount()">Log out</button><div id="accountError" role="alert"></div></div>`;}
async function signOutAccount(){if(authBusy||currentUser?.is_anonymous)return;authBusy=true;try{const {error}=await db.auth.signOut({scope:'local'});if(error)throw error;takeUser(null);cleanAuthUrl();setScreenUrl('discover',null,true);nav(false);welcome();}catch(error){const el=document.getElementById('accountError');if(el)el.textContent=error.message;}finally{authBusy=false;}}

function cityOptions(selected=""){return Object.keys(CITIES).map(c=>`<option ${c===selected?"selected":""}>${c}</option>`).join("");}
function profileForm(){stopChatRefresh();setActiveNav(2);const p=myProfile||{};photoEditVersion++;photoDraft=photoPaths(p).map(path=>({path,preview:photoUrl(path)}));photosDirty=false;photoPreparing=false;selectedVibes=parseArr(p.vibes);selectedDestinations=parseArr(p.destinations);app().innerHTML=`<div class="card"><div class="eyebrow">${myProfile?"Edit profile":"Create profile"}</div><h2>Make it your profile</h2><div class="photo-editor"><label for="profilePhotoInput">Your photos</label><p class="muted">Add up to six photos. Your first photo is your main one.</p><div id="photoGrid" class="photo-grid"></div><input id="profilePhotoInput" type="file" multiple accept="image/jpeg,image/png,image/webp" onchange="preparePhotos(this)"><small id="photoStatus" role="status">Choose clear photos of yourself. Changes apply when you save.</small></div>
<div class="row"><div class="field"><label>First name</label><input id="name" maxlength="50" value="${esc(p.display_name||"")}" placeholder="Frida"></div><div class="field"><label>Age</label><input id="age" type="number" min="18" max="99" value="${p.age||""}" placeholder="29"></div></div>
<div class="field"><label>Home city</label><select id="city">${cityOptions(p.city||"Malmö")}</select><div class="sliderline"><span>City-level location only</span><span>Not your exact address</span></div></div>
<div class="field"><label>Bio</label><textarea id="bio" maxlength="280" placeholder="Beach days, good food and spontaneous weekend trips.">${esc(p.bio||"")}</textarea></div>
<div class="summary trip-editor"><b>Your next trip</b><div class="field"><label for="nextDestination">Next destination</label><input id="nextDestination" maxlength="100" value="${esc(p.next_destination||'')}" placeholder="For example, Barcelona"><small class="muted">Leave blank if you are open to ideas.</small></div><label class="flexible-option"><input id="flexibleDates" type="checkbox" ${p.flexible_dates!==false?'checked':''} onchange="updateTravelDateInputs()"> My dates are flexible</label><div class="row"><div class="field"><label for="travelStart">From</label><input id="travelStart" type="date" value="${esc(p.travel_start||'')}" ${p.flexible_dates!==false?'disabled':''}></div><div class="field"><label for="travelEnd">To</label><input id="travelEnd" type="date" value="${esc(p.travel_end||'')}" ${p.flexible_dates!==false?'disabled':''}></div></div></div>
<div class="field"><label>Languages</label><input id="languages" maxlength="100" value="${esc(p.languages||"")}" placeholder="English, Greek, Swedish"></div>
<div class="field"><label>Looking for</label><select id="looking">${LOOKING.map(x=>`<option ${x===(p.looking_for||"Travel buddy")?"selected":""}>${x}</option>`).join("")}</select></div>
<div class="field"><label>Travel pace</label><select id="travelPace">${['Relaxed','Balanced','Packed'].map(x=>`<option ${x===(p.travel_pace||'Balanced')?'selected':''}>${x}</option>`).join('')}</select><small class="muted">How full do you like your days?</small></div>

function toggleChoice(btn,type,value){const arr=type==="vibe"?selectedVibes:selectedDestinations;const i=arr.indexOf(value);if(i>=0)arr.splice(i,1);else arr.push(value);btn.classList.toggle("on");}
let photoDraft=[],photosDirty=false,photoPreparing=false,profileSaving=false,photoEditVersion=0;
function photoPaths(p){return (Array.isArray(p?.photo_paths)?p.photo_paths:p?.photo_path?[p.photo_path]:[]).filter(x=>typeof x==='string'&&x).slice(0,6);}
function photoUrl(path){return db.storage.from('tripmatch-photos').getPublicUrl(path).data.publicUrl;}
function profilePhoto(p){const paths=photoPaths(p);return paths.length?photoUrl(paths[0]):'';}
function renderPhotoEditor(){const grid=document.getElementById('photoGrid');if(!grid)return;grid.innerHTML=photoDraft.map((photo,i)=>`<div class="photo-slot"><img src="${esc(photo.preview)}" alt="Profile photo ${i+1}"><span class="photo-number">${i===0?'Main':i+1}</span><div class="photo-tools">${i>0?`<button type="button" onclick="makeMainPhoto(${i})" aria-label="Make photo ${i+1} your main photo">Make main</button>`:''}<button type="button" onclick="removePhoto(${i})" aria-label="Remove photo ${i+1}">Remove</button></div></div>`).join('')+(photoDraft.length<6?`<label class="photo-add" for="profilePhotoInput"><span aria-hidden="true">+</span>Add photo<small>${photoDraft.length}/6</small></label>`:'');document.getElementById('profilePhotoInput').disabled=photoDraft.length>=6||photoPreparing||profileSaving;grid.querySelectorAll('button').forEach(b=>b.disabled=photoPreparing||profileSaving);}
function makeMainPhoto(i){if(photoPreparing||profileSaving)return;photoDraft.unshift(photoDraft.splice(i,1)[0]);photosDirty=true;renderPhotoEditor();}
function removePhoto(i){if(photoPreparing||profileSaving)return;photoDraft.splice(i,1);photosDirty=true;renderPhotoEditor();document.getElementById('photoStatus').textContent='Photo removed. Save your profile to apply changes.';}
async function preparePhotos(input){if(photoPreparing||profileSaving)return;const files=Array.from(input.files),version=photoEditVersion,status=document.getElementById('photoStatus'),save=document.getElementById('saveProfileButton');if(!files.length)return;const available=6-photoDraft.length,chosen=files.slice(0,available);photoPreparing=true;save.disabled=true;renderPhotoEditor();let added=0,failed=0;status.textContent='Preparing photos…';try{for(const file of chosen){if(version!==photoEditVersion)return;let url;try{if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>20*1024*1024)throw Error('Invalid photo');url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.86));if(!blob)throw Error('Image unavailable');if(version!==photoEditVersion)return;photoDraft.push({blob,preview:canvas.toDataURL('image/jpeg',.86)});photosDirty=true;added++;}catch(e){failed++;}finally{if(url)URL.revokeObjectURL(url);}}status.textContent=`${added} photo${added===1?'':'s'} ready. Save your profile to apply changes.`+(files.length>available?' Only six photos fit on your profile.':'')+(failed?' Some photos could not be opened. Use JPG, PNG or WebP under 20 MB.':'');}finally{if(version===photoEditVersion){photoPreparing=false;save.disabled=false;input.value='';renderPhotoEditor();}}}
let travelerPhotoIndex=0;
function selectTravelerPhoto(index){const p=deck[deckIndex],paths=photoPaths(p),img=document.querySelector('#travelerCard .traveler-photo');if(!img||!paths.length)return;travelerPhotoIndex=Math.max(0,Math.min(paths.length-1,index));img.style.visibility='visible';img.src=photoUrl(paths[travelerPhotoIndex]);img.alt=p.display_name+' · photo '+(travelerPhotoIndex+1)+' of '+paths.length;document.querySelectorAll('.photo-progress button').forEach((b,i)=>{b.setAttribute('aria-pressed',String(i===travelerPhotoIndex));});const status=document.getElementById('travelerPhotoStatus');if(status)status.textContent='Photo '+(travelerPhotoIndex+1)+' of '+paths.length;}
async function saveProfile(){if(profileSaving||photoPreparing)return;const name=document.getElementById("name").value.trim(),age=+document.getElementById("age").value,city=document.getElementById("city").value,c=CITIES[city],minAge=+document.getElementById("minAge").value,maxAge=+document.getElementById("maxAge").value;if(!name||age<18){alert("Add your name and make sure age is 18+.");return;}if(minAge>maxAge){alert("Minimum age can't be higher than maximum age.");return;}const flexible=document.getElementById('flexibleDates').checked,start=document.getElementById('travelStart').value,end=document.getElementById('travelEnd').value;if(!flexible&&(!start||!end||end<start||start<localDateToday())){alert('Choose future travel dates, with the end on or after the start, or choose flexible dates.');return;}const row={next_destination:document.getElementById('nextDestination').value.trim(),flexible_dates:flexible,travel_start:flexible?null:start,travel_end:flexible?null:end,user_id:currentUser.id,display_name:name,age,bio:document.getElementById("bio").value.trim(),city,lat:c.lat,lng:c.lng,distance_km:+document.getElementById("distance").value,min_age:minAge,max_age:maxAge,vibes:JSON.stringify(selectedVibes),destinations:JSON.stringify(selectedDestinations),looking_for:document.getElementById("looking").value,travel_pace:document.getElementById("travelPace").value,travel_scope:document.getElementById("travelScope").value,room_preference:document.getElementById("roomPreference").value,languages:document.getElementById("languages").value.trim(),budget:document.getElementById("budget").value};const editing=!!myProfile,button=document.getElementById('saveProfileButton'),draft=photoDraft.slice(),changed=photosDirty,oldPaths=photoPaths(myProfile);profileSaving=true;button.disabled=true;button.textContent='Saving…';renderPhotoEditor();const uploaded=[];try{if(changed){const paths=[];for(const photo of draft){if(photo.path){paths.push(photo.path);continue;}const path=currentUser.id+'/'+crypto.randomUUID()+'.jpg';const upload=await db.storage.from('tripmatch-photos').upload(path,photo.blob,{contentType:'image/jpeg',upsert:false});if(upload.error)throw Error('Photo upload failed. '+upload.error.message);uploaded.push(path);paths.push(path);}row.photo_paths=paths;row.photo_path=paths[0]||null;}const {data,error}=await db.from(PROFILE_TABLE).upsert(row).select().single();if(error)throw error;myProfile=data;photosDirty=false;if(changed){const removed=oldPaths.filter(path=>!row.photo_paths.includes(path));if(removed.length)db.storage.from('tripmatch-photos').remove(removed).catch(()=>{});}nav(true);if(editing)profileScreen();else discover();}catch(error){if(uploaded.length)await db.storage.from('tripmatch-photos').remove(uploaded).catch(()=>{});alert('Could not save profile: '+error.message);}finally{profileSaving=false;if(button.isConnected){button.disabled=false;button.textContent='Save profile →';renderPhotoEditor();}}}

function localDateToday(){const now=new Date();return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');}
function updateTravelDateInputs(){const flexible=document.getElementById('flexibleDates').checked;document.getElementById('travelStart').disabled=flexible;document.getElementById('travelEnd').disabled=flexible;}
function tripDate(date){return new Date(date+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function nextTripSummary(p){if(!p.next_destination&&!p.travel_start)return '';const dates=p.flexible_dates!==false?'Flexible dates':p.travel_start&&p.travel_end?tripDate(p.travel_start)+' – '+tripDate(p.travel_end):'Dates to be decided';return `<div class="next-trip"><strong>Next trip · ${esc(p.next_destination||'Open to ideas')}</strong><span>${esc(dates)}</span></div>`;}
function sharedReasons(other){const me=myProfile||{},reasons=[],clean=x=>(x||'').trim().toLocaleLowerCase();if(clean(me.next_destination)&&clean(me.next_destination)===clean(other.next_destination))reasons.push('Both planning '+other.next_destination);const destinations=parseArr(me.destinations).filter(x=>parseArr(other.destinations).includes(x)&&!(clean(me.next_destination)===clean(other.next_destination)&&clean(x)===clean(other.next_destination)));if(destinations.length)reasons.push('Both want to visit '+destinations.slice(0,2).join(' & '));const vibes=parseArr(me.vibes).filter(x=>parseArr(other.vibes).includes(x));if(vibes.length)reasons.push('Both into '+vibes.slice(0,3).join(' · '));if(me.budget&&me.budget===other.budget)reasons.push('Similar budget · '+other.budget);if(me.travel_pace&&me.travel_pace===other.travel_pace)reasons.push('Same travel pace · '+other.travel_pace);if(me.flexible_dates===false&&other.flexible_dates===false&&me.travel_start&&me.travel_end&&other.travel_start&&other.travel_end&&me.travel_end>=localDateToday()&&other.travel_end>=localDateToday()&&me.travel_start<=other.travel_end&&other.travel_start<=me.travel_end)reasons.unshift('Your travel dates overlap');return reasons.slice(0,3);}
function sharedReasonsHTML(p){const reasons=sharedReasons(p);return reasons.length?`<div class="shared-reasons" aria-label="What you share">${reasons.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'';}
function haversine(a,b){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng);const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function effectiveLoc(){if(myProfile?.is_plus&&myProfile.travel_mode_lat!=null)return{lat:myProfile.travel_mode_lat,lng:myProfile.travel_mode_lng,city:myProfile.travel_mode_city};return{lat:myProfile.lat,lng:myProfile.lng,city:myProfile.city};}
async function likesToday(){const start=new Date();start.setHours(0,0,0,0);const {data,error}=await db.from(LIKE_TABLE).select("id").eq("liker_user_id",currentUser.id).gte("created_at",start.toISOString());return error?0:(data||[]).length;}
async function discover(options={}){if(options.updateUrl!==false)setScreenUrl('discover');stopChatRefresh();setActiveNav(0);if(!myProfile){profileForm();return;}nav(true);if(myProfile.is_discoverable===false){document.body.classList.remove('discover-mode');app().innerHTML=`<div class="card" style="text-align:center"><h2>Discovery is paused</h2><p class="muted">Your profile is hidden from new people. Your matches and chats are still here.</p><button class="primary" onclick="toggleDiscovery()">Resume discovery</button><button class="secondary" style="margin-top:10px" onclick="showSaved()">Saved profiles</button></div>`;return;}app().innerHTML=`<div class="card"><h2>Finding travelers…</h2><p class="muted">Finding people in your age and distance range.</p></div>`;const [profilesRes,likesRes,blocksRes,savedRes]=await Promise.all([db.from(PROFILE_TABLE).select("*").neq("user_id",currentUser.id),db.from(LIKE_TABLE).select("liked_user_id").eq("liker_user_id",currentUser.id),db.from(BLOCK_TABLE).select("blocked_user_id").eq("blocker_user_id",currentUser.id),db.from(SAVED_TABLE).select("saved_user_id").eq("user_id",currentUser.id)]);if(profilesRes.error||savedRes.error){app().innerHTML=`<div class="card"><h2>Could not load travelers</h2><p class="muted">${esc((profilesRes.error||savedRes.error).message)}</p></div>`;return;}savedIds=new Set((savedRes.data||[]).map(x=>x.saved_user_id));const liked=new Set((likesRes.data||[]).map(x=>x.liked_user_id)),blocked=new Set((blocksRes.data||[]).map(x=>x.blocked_user_id)),loc=effectiveLoc();deck=(profilesRes.data||[]).map(p=>({...p,_distance:Math.round(haversine(loc,p))})).filter(p=>p.is_discoverable!==false&&!liked.has(p.user_id)&&!blocked.has(p.user_id)&&!savedIds.has(p.user_id)&&!passed.has(p.user_id)&&p.age>=myProfile.min_age&&p.age<=myProfile.max_age&&p._distance<=myProfile.distance_km).sort((a,b)=>a._distance-b._distance);deckIndex=0;showCard();}

async function showCard(){const used=await likesToday(),remaining=myProfile.is_plus?"∞":Math.max(0,100-used);if(deckIndex>=deck.length){document.body.classList.remove('discover-mode');app().innerHTML=`<div class="card" style="text-align:center"><h2>No more travelers in this range</h2><p class="muted">Different destinations are welcome. Try increasing your distance or age range, or check back when more people join.</p><button class="primary" onclick="settingsScreen()">Change discovery settings</button><button class="secondary" style="margin-top:10px" onclick="showSaved()">Saved profiles</button><button class="secondary" style="margin-top:10px" onclick="discover()">Refresh people</button></div>`;return;}document.body.classList.add('discover-mode');travelerPhotoIndex=0;const p=deck[deckIndex],vibes=parseArr(p.vibes),dests=parseArr(p.destinations),photo=profilePhoto(p);app().innerHTML=`<div class="card" id="travelerCard" style="padding:0;overflow:hidden"><div class="swipe-indicator like-indicator" aria-hidden="true">LIKE</div><div class="swipe-indicator pass-indicator" aria-hidden="true">PASS</div><div class="profilehero"><div class="avatar" aria-hidden="true">${esc(initials(p.display_name))}</div>${photo?`<img class="traveler-photo" src="${esc(photo)}" alt="${esc(p.display_name)}'s profile photo" draggable="false" onerror="this.style.visibility='hidden'">`:''}<div class="profileoverlay"></div>${photoPaths(p).length>1?`<div class="photo-progress" aria-label="Profile photos">${photoPaths(p).map((_,i)=>`<button aria-label="Show photo ${i+1}" aria-pressed="${i===0}" onclick="selectTravelerPhoto(${i})"><span></span></button>`).join('')}</div><span class="photo-hint" id="travelerPhotoStatus" role="status">Photo 1 of ${photoPaths(p).length}</span>`:''}<div class="profilecontent"><h2>${esc(p.display_name)}, ${p.age}</h2><div class="profilemeta">${esc(p.city)} · ${p._distance} km away</div><div class="traveler-details" tabindex="0" aria-label="Traveler details">${nextTripSummary(p)}${sharedReasonsHTML(p)}<p>${esc(p.bio||"Ready for the next trip.")}</p><div class="travel-boundaries">${esc(p.travel_pace||'Balanced')} pace · ${esc(p.travel_scope||'A few days')} · ${esc(p.room_preference||'Separate rooms')}</div><div class="chips">${vibes.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><div class="travel-plan"><strong>Wants to go</strong>${dests.length?esc(dests.join(" · ")):"Open to ideas"}<br>${esc(p.looking_for==='Group trips'?'Travel buddy':p.looking_for)} · Budget ${esc(p.budget)}${p.languages?`<br>${esc(p.languages)}`:''}</div></div><div class="actions"><button class="pass" aria-label="Pass on ${esc(p.display_name)}" onclick="chooseTraveler(false)">✕</button><button class="like" aria-label="Like ${esc(p.display_name)}" onclick="chooseTraveler(true)">♥</button></div><button class="save-later" onclick="savePersonForLater()" aria-label="Save ${esc(p.display_name)} for later">♧ Save for later</button><div class="counter">${myProfile.is_plus?"Unlimited likes":remaining+" likes left today"}</div><div class="traveler-safety"><button onclick="reportPerson()">Report</button><button onclick="blockPerson()">Block</button></div></div></div></div>`;bindTravelerSwipe();}

let travelerChoicePending=false;
function resetTravelerCard(card){if(!card)return;card.style.transition='transform .18s ease, opacity .18s ease';card.style.transform='';card.style.opacity='';card.querySelectorAll('.swipe-indicator').forEach(el=>el.style.opacity='0');}
async function chooseTraveler(like){const card=document.getElementById('travelerCard');if(!card||travelerChoicePending||!deck[deckIndex])return;travelerChoicePending=true;card.querySelectorAll('button').forEach(b=>b.disabled=true);try{const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;card.style.transition=reduce?'none':'transform .18s ease-out, opacity .18s ease-out';card.style.transform=`translateX(${(like?1:-1)*Math.max(innerWidth,800)}px) rotate(${like?12:-12}deg)`;card.style.opacity='0';await new Promise(resolve=>setTimeout(resolve,reduce?0:180));if(!card.isConnected)return;if(like)await likePerson();else await passPerson();}catch(error){if(card.isConnected)alert('Could not save your choice: '+error.message);}finally{if(card.isConnected){resetTravelerCard(card);card.querySelectorAll('button').forEach(b=>b.disabled=false);}travelerChoicePending=false;}}
function bindTravelerSwipe(){const card=document.getElementById('travelerCard');if(!card)return;let gesture=null;const reset=()=>{gesture=null;resetTravelerCard(card);};card.addEventListener('pointerdown',event=>{if(travelerChoicePending||!event.isPrimary||(event.pointerType==='mouse'&&event.button!==0)||event.target.closest('button,a,input,textarea,select'))return;gesture={id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,axis:null,details:!!event.target.closest('.profilecontent')};card.style.transition='none';card.setPointerCapture(event.pointerId);});card.addEventListener('pointermove',event=>{if(!gesture||gesture.id!==event.pointerId||travelerChoicePending)return;const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;if(!gesture.axis&&Math.max(Math.abs(dx),Math.abs(dy))>8)gesture.axis=Math.abs(dx)>Math.abs(dy)*1.15?'x':'y';if(gesture.axis!=='x')return;gesture.dx=dx;card.style.transform=`translateX(${dx}px) rotate(${Math.max(-12,Math.min(12,dx/22))}deg)`;const strength=Math.min(1,Math.abs(dx)/85);card.querySelector('.like-indicator').style.opacity=dx>0?strength:0;card.querySelector('.pass-indicator').style.opacity=dx<0?strength:0;});card.addEventListener('pointerup',event=>{if(!gesture||gesture.id!==event.pointerId)return;const g=gesture;gesture=null;if(card.hasPointerCapture(event.pointerId))card.releasePointerCapture(event.pointerId);const threshold=Math.min(85,card.clientWidth*.22);if(g.axis==='x'&&Math.abs(g.dx)>=threshold)chooseTraveler(g.dx>0);else {resetTravelerCard(card);if(!g.axis&&Math.abs(event.clientX-g.x)<8&&Math.abs(event.clientY-g.y)<8&&!g.details){const bounds=card.getBoundingClientRect();selectTravelerPhoto(travelerPhotoIndex+(event.clientX-bounds.left<bounds.width/2?-1:1));}}});card.addEventListener('pointercancel',reset);card.addEventListener('lostpointercapture',()=>{if(gesture)reset();});}
async function savePersonForLater(){const p=deck[deckIndex];if(!p||travelerChoicePending)return;travelerChoicePending=true;try{const {error}=await db.from(SAVED_TABLE).insert({user_id:currentUser.id,saved_user_id:p.user_id});if(error&&!String(error.message).toLowerCase().includes('duplicate'))throw error;savedIds.add(p.user_id);deckIndex++;await showCard();}catch(error){alert('Could not save this profile: '+error.message);}finally{travelerChoicePending=false;}}
async function passPerson(){if(deck[deckIndex])passed.add(deck[deckIndex].user_id);deckIndex++;await showCard();}
async function likePerson(){const p=deck[deckIndex];if(!p)return;const used=await likesToday();if(!myProfile.is_plus&&used>=100){showPlus("You've used today's 100 free likes.");return;}const {error}=await db.from(LIKE_TABLE).insert({liker_user_id:currentUser.id,liked_user_id:p.user_id});if(error&&!String(error.message).toLowerCase().includes("duplicate")){alert("Could not save like: "+error.message);return;}const {data:matched}=await db.rpc("tripmatch_make_match",{p_other_user:p.user_id});if(matched){showMatch(p);return;}deckIndex++;await showCard();}
let newMatchProfile=null;
function showMatch(p){
 stopChatRefresh();newMatchProfile=p;nav(true);
 const reason=sharedReasons(p)[0]||'You both liked each other';
 const myPhoto=profilePhoto(myProfile),theirPhoto=profilePhoto(p);
 app().innerHTML=`<div class="card new-match">
  <div class="eyebrow">A new connection</div><h1>It's a TripMatch.</h1>
  <div class="new-match-photos">
   ${myPhoto?`<img src="${esc(myPhoto)}" alt="Your profile photo">`:`<span aria-label="Your profile">${esc(initials(myProfile.display_name))}</span>`}
   <b aria-hidden="true">♥</b>
   ${theirPhoto?`<img src="${esc(theirPhoto)}" alt="${esc(p.display_name)}'s profile photo">`:`<span aria-label="${esc(p.display_name)}">${esc(initials(p.display_name))}</span>`}
  </div>
  <h2>You and ${esc(p.display_name)} matched</h2><p class="new-match-reason">${esc(reason)}</p>
  <button class="primary" onclick="openNewMatchChat()" id="newMatchChatButton">Message ${esc(p.display_name)}</button>
  <button class="new-match-later" onclick="newMatchProfile=null;deckIndex++;showCard()">Keep discovering</button>
  <p id="newMatchError" role="alert"></p>
 </div>`;
}
async function openNewMatchChat(){
 const p=newMatchProfile,button=document.getElementById('newMatchChatButton');
 if(!p||!button||button.disabled)return;
 button.disabled=true;button.textContent='Opening chat…';
 try{
  const {data,error}=await db.from(MATCH_TABLE).select('id,user_a,user_b,ended_at').or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`);
  if(error)throw error;
  const match=(data||[]).find(m=>!m.ended_at&&((m.user_a===currentUser.id&&m.user_b===p.user_id)||(m.user_b===currentUser.id&&m.user_a===p.user_id)));
  if(!match)throw Error('Match unavailable');
  newMatchProfile=null;
  await showChat(match.id,p.user_id);
 }catch(error){
  const message=document.getElementById('newMatchError');
  if(message)message.textContent='Could not open the chat. You can find this connection in Matches.';
  if(button.isConnected){button.disabled=false;button.textContent='Message '+p.display_name;}
 }
}

async function refreshUnread(){if(!currentUser||unreadLoading)return;const userId=currentUser.id;unreadLoading=true;try{const {data,error}=await db.rpc('tripmatch_unread_counts');if(error||currentUser?.id!==userId)return;unreadCounts=new Map((data||[]).map(r=>[String(r.match_id),Number(r.unread_count)]));paintUnread();}catch(e){}finally{unreadLoading=false;}}
async function showMatches(options={}){if(options.updateUrl!==false)setScreenUrl('matches',null,!!options.replaceUrl);stopChatRefresh();const version=screenVersion;setActiveNav(1);if(!myProfile)return profileForm();nav(true);app().innerHTML='<div class="card"><h2>Loading matches…</h2></div>';const {data,error}=await db.from(MATCH_TABLE).select("*").or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`).order("created_at",{ascending:false});if(version!==screenVersion)return;if(error){app().innerHTML='<div class="card"><h2>Could not load matches</h2><button class="secondary" onclick="showMatches()">Try again</button></div>';return;}const items=(data||[]).filter(m=>!m.ended_at).map(m=>({match:m,otherId:m.user_a===currentUser.id?m.user_b:m.user_a}));const ids=items.map(x=>x.otherId);let profiles=[];if(ids.length){const r=await db.from(PROFILE_TABLE).select("*").in("user_id",ids);profiles=r.data||[];}if(version!==screenVersion)return;const byId=new Map(profiles.map(p=>[p.user_id,p]));app().innerHTML=`<div class="card matches-card"><div class="eyebrow">Your connections</div><h2>Matches</h2>${items.length?items.map(item=>{const p=byId.get(item.otherId);if(!p)return"";return `<div class="matchrow"><div class="miniavatar">${profilePhoto(p)?`<img src="${esc(profilePhoto(p))}" alt="" onerror="this.remove()">`:esc(initials(p.display_name))}</div><div class="grow"><b>${esc(p.display_name)}, ${p.age}</b><br><small>${esc(p.city)} · ${esc(p.looking_for)}</small></div><button class="iconbtn" onclick="showChat('${item.match.id}','${item.otherId}')">Chat <span class="unread-badge" data-unread-match="${item.match.id}" hidden></span></button></div>`;}).join(""):`<div class="summary">No matches yet. Your next travel person might be one Like away.</div>`}</div>`;paintUnread();refreshUnread();}

function updateComposer(){const input=document.getElementById('messageInput'),button=document.getElementById('sendButton');if(!input||!button)return;input.style.height='38px';input.style.height=Math.min(110,input.scrollHeight)+'px';button.disabled=!input.value.trim()||!!activeChat?.sending;}

function chatDateLabel(value){const d=new Date(value),today=new Date(),yesterday=new Date();yesterday.setDate(today.getDate()-1);if(d.toDateString()===today.toDateString())return 'Today';if(d.toDateString()===yesterday.toDateString())return 'Yesterday';return d.toLocaleDateString([],{month:'short',day:'numeric',...(d.getFullYear()!==today.getFullYear()?{year:'numeric'}:{})});}
async function loadChatMessages(scrollToEnd=false){const chat=activeChat;if(!chat||chat.loading)return;chat.loading=true;try{const match=await db.from(MATCH_TABLE).select('id,ended_at').eq('id',chat.matchId).maybeSingle();if(activeChat!==chat)return;if(match.error)throw match.error;if(!match.data||match.data.ended_at){chatClosed();return;}const {data,error}=await db.from(MESSAGE_TABLE).select("*").eq("match_id",chat.matchId).order("id",{ascending:false}).limit(200);if(activeChat!==chat)return;const box=document.getElementById("messages");if(!box)return;if(error){document.getElementById('chatError').textContent='Could not load messages: '+error.message;return;}const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90,rows=(data||[]).slice().reverse(),signature=JSON.stringify(rows);if(signature!==chat.lastMessages){chat.lastMessages=signature;let previousDate='';box.innerHTML=rows.length?rows.map(m=>{const mine=m.sender_user_id===currentUser.id,d=chatDateLabel(m.created_at),separator=d!==previousDate?`<div class="chat-date">${esc(d)}</div>`:'';previousDate=d;const t=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return `${separator}<div class="msgrow ${mine?'mine':''}"><div class="bubble">${esc(m.body)}</div><time class="msgtime" datetime="${esc(m.created_at)}">${esc(t)}</time></div>`;}).join(""):`<div class="emptychat"><div class="chat-avatar" aria-hidden="true">${esc(initials(chat.otherName))}</div><h4>You and ${esc(chat.otherName)}</h4><p>Start with a question about your next trip.</p><div class="chat-starters">${chatPromptOptions(chat.otherProfile).map((prompt,i)=>`<button type="button" onclick="useChatPrompt(${i})">${esc(prompt)}</button>`).join("")}</div><small>Tap a question to edit it before sending.</small></div>`;}if(scrollToEnd||nearBottom)box.scrollTop=box.scrollHeight;if(!document.hidden&&rows.length&&(scrollToEnd||nearBottom)){const last=String(rows[rows.length-1].id);if(chat.lastRead!==last){const read=await db.rpc('tripmatch_mark_read',{p_match_id:chat.matchId,p_message_id:last});if(!read.error&&activeChat===chat){chat.lastRead=last;refreshUnread();}}}}catch(error){if(activeChat===chat){const el=document.getElementById('chatError');if(el)el.textContent='Could not refresh the conversation. Please try again.';}}finally{chat.loading=false;}}
function chatPromptOptions(other){
 const shared=parseArr(myProfile?.destinations).find(city=>parseArr(other.destinations).includes(city));
 const place=shared||(myProfile?.next_destination&&myProfile.next_destination.trim().toLowerCase()===(other.next_destination||'').trim().toLowerCase()?other.next_destination:null);
 const first=place?'What would your perfect day in '+place+' look like?':other.next_destination?'What draws you to '+other.next_destination+'?':'Where would you love to travel next?';
 return [first,'What kind of trip do you enjoy most?','What is one place you would visit again?'];
}
function useChatPrompt(index){

 const prompt=chatPromptOptions(chat.otherProfile)[index];

async function moderationScreen(options={}){if(!isModerator){profileScreen();return;}if(options.updateUrl!==false)setScreenUrl('moderation');stopChatRefresh();setActiveNav(2);nav(true);document.body.classList.remove('discover-mode');app().innerHTML='<div class="card"><h2>Reports</h2><p class="muted">Loading private review queue…</p></div>';const version=screenVersion;const {data,error}=await db.from(REPORT_TABLE).select('id,reporter_user_id,reported_user_id,reason,created_at,status').eq('status','pending').order('created_at',{ascending:true});if(version!==screenVersion)return;if(error){app().innerHTML=`<div class="card"><h2>Could not load reports</h2><p class="muted">${esc(error.message)}</p></div>`;return;}const reports=data||[],ids=[...new Set(reports.map(r=>r.reported_user_id))];let profiles=[];if(ids.length){const r=await db.from(PROFILE_TABLE).select('user_id,display_name,city,is_suspended').in('user_id',ids);profiles=r.data||[];}if(version!==screenVersion)return;const byId=new Map(profiles.map(p=>[p.user_id,p]));app().innerHTML=`<div class="card"><div class="eyebrow">Private moderation</div><h2>Reports${reports.length?' · '+reports.length:''}</h2><p class="muted">Review each report before taking action. Suspension hides the account and closes its active matches.</p>${reports.length?reports.map(r=>{const p=byId.get(r.reported_user_id),date=new Date(r.created_at).toLocaleString();return `<article class="moderation-item"><h3>${esc(p?.display_name||'Unknown profile')}${p?.is_suspended?' · Suspended':''}</h3><small>${esc(p?.city||'')} · ${esc(date)}</small><p><b>Report:</b> ${esc(r.reason)}</p><small>Reported account: ${esc(r.reported_user_id)}</small><div class="moderation-actions"><button class="secondary" onclick="moderateReport(${Number(r.id)},'dismiss')">Dismiss</button><button class="danger" onclick="moderateReport(${Number(r.id)},'suspend')">Suspend account</button></div></article>`;}).join(''):'<div class="summary">No pending reports.</div>'}<button class="secondary" style="margin-top:15px" onclick="settingsScreen()">Back to settings</button></div>`;}
async function moderateReport(id,action){if(!isModerator||!Number.isSafeInteger(id))return;const message=action==='suspend'?'Suspend this account and close its active matches?':'Dismiss this report without suspending the account?';if(!confirm(message))return;const buttons=Array.from(document.querySelectorAll('.moderation-actions button'));buttons.forEach(b=>b.disabled=true);const {error}=await db.rpc('tripmatch_moderate_report',{p_report_id:id,p_action:action});if(error){alert('Could not complete review: '+error.message);buttons.forEach(b=>b.disabled=false);return;}await moderationScreen({updateUrl:false});}
function profileScreen(options={}){
 if(options.updateUrl!==false)setScreenUrl('profile');
 stopChatRefresh();setActiveNav(2);if(!myProfile)return profileForm();
 nav(true);document.body.classList.remove('discover-mode');
 const p=myProfile,photo=profilePhoto(p),vibes=parseArr(p.vibes).slice(0,3);
 app().innerHTML=`<div class="card tm-profile">
   <div class="tm-profile-top"><span class="eyebrow">Your profile</span><button type="button" class="tm-gear" onclick="settingsScreen()" aria-label="Open settings" title="Settings">⚙</button></div>
   <div class="tm-profile-identity">${photo?`<img class="tm-own-avatar" src="${esc(photo)}" alt="Your main profile photo">`:`<div class="tm-own-avatar tm-own-initial" aria-hidden="true">${esc(initials(p.display_name))}</div>`}<h2>${esc(p.display_name)}, ${Number(p.age)}</h2><p>${esc(p.city||'')}</p></div>
   <div class="tm-profile-summary">${p.bio?`<p>${esc(p.bio)}</p>`:''}${nextTripSummary(p)}${vibes.length?`<div class="chips">${vibes.map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div>`:''}</div>
   <button class="primary" onclick="profileForm()">Edit profile</button>
   <button class="tm-list-link" onclick="showSaved()"><span>Saved profiles</span><span aria-hidden="true">›</span></button>
 </div>`;
}
function settingsScreen(options={}){
 if(options.updateUrl!==false)setScreenUrl('settings');
 stopChatRefresh();setActiveNav(2);if(!myProfile)return profileForm();
 nav(true);document.body.classList.remove('discover-mode');
 const p=myProfile,paused=p.is_discoverable===false;
 app().innerHTML=`<div class="tm-settings-header"><button class="backlink" onclick="profileScreen()" aria-label="Back to profile">‹ Profile</button><h2>Settings</h2></div>
 <div class="card tm-settings-card"><h3>Discovery</h3><p class="muted" style="font-size:13px;margin:0 0 16px">People within your age and distance range can appear, whatever their travel interests. Distance is measured from your profile city, or your Travel Mode city when active.</p>
 <div class="field"><label for="settingsDistance">Maximum distance <span id="settingsDistanceValue">${Number(p.distance_km)||50} km</span></label><input id="settingsDistance" type="range" min="1" max="500" value="${Number(p.distance_km)||50}" oninput="document.getElementById('settingsDistanceValue').textContent=this.value+' km'"></div>
 <div class="row"><div class="field"><label for="settingsMinAge">Minimum age</label><input id="settingsMinAge" type="number" min="18" max="99" value="${Number(p.min_age)||18}"></div><div class="field"><label for="settingsMaxAge">Maximum age</label><input id="settingsMaxAge" type="number" min="18" max="99" value="${Number(p.max_age)||45}"></div></div>
 <p id="settingsError" class="tm-settings-error" role="alert"></p><button id="saveDiscoveryButton" class="secondary" onclick="saveDiscoverySettings()">Save preferences</button>
 <div class="tm-settings-divider"></div>
 <div class="tm-setting-row"><div><b>Show me in Discovery</b><p>${paused?'Paused. Your existing matches can still chat.':'New people can find your profile.'}</p></div><button class="tm-toggle ${paused?'':'on'}" onclick="toggleDiscovery()" role="switch" aria-checked="${paused?'false':'true'}" aria-label="Show me in Discovery"><span></span></button></div>
 <button class="tm-list-link" onclick="travelMode()"><span>Travel Mode <small>${esc(p.travel_mode_city||'Change discovery city')}</small></span><span aria-hidden="true">›</span></button></div>
 ${accountCard()}
 ${isModerator?`<div class="card tm-settings-card"><h3>Private tools</h3><button class="tm-list-link" id="reviewReportsButton" onclick="moderationScreen()">Review reports <span aria-hidden="true">›</span></button></div>`:''}`;
 if(isModerator)refreshReportBadge();
}
async function saveDiscoverySettings(){
 if(!myProfile||!currentUser)return;
 const distance=Number(document.getElementById('settingsDistance').value),min=Number(document.getElementById('settingsMinAge').value),max=Number(document.getElementById('settingsMaxAge').value),message=document.getElementById('settingsError'),button=document.getElementById('saveDiscoveryButton');
 if(!Number.isInteger(distance)||distance<1||distance>500||!Number.isInteger(min)||!Number.isInteger(max)||min<18||max>99||min>max){message.textContent='Choose ages from 18 to 99, with the minimum no higher than the maximum.';return;}
 message.textContent='';button.disabled=true;
 try{const {data,error}=await db.from(PROFILE_TABLE).update({distance_km:distance,min_age:min,max_age:max}).eq('user_id',currentUser.id).select().single();if(error)throw error;myProfile=data;settingsScreen({updateUrl:false});const notice=document.createElement('p');notice.className='good';notice.setAttribute('role','status');notice.textContent='Discovery preferences saved.';document.querySelector('.tm-settings-card').prepend(notice);}
 catch(error){message.textContent='Could not save preferences. Please try again.';button.disabled=false;}
}
function travelMode(){if(!myProfile?.is_plus){showPlus("Travel Mode lets you match from another city before you arrive.");return;}app().innerHTML=`<div class="card"><div class="eyebrow">Travel Mode</div><h2>Match from another city</h2><div class="field"><label>Discovery city</label><select id="travelCity">${cityOptions(myProfile.travel_mode_city||myProfile.city)}</select></div><button class="primary" onclick="saveTravelMode()">Use this city</button></div>`;}
async function saveTravelMode(){const city=document.getElementById("travelCity").value,c=CITIES[city];const {data,error}=await db.from(PROFILE_TABLE).update({travel_mode_city:city,travel_mode_lat:c.lat,travel_mode_lng:c.lng}).eq("user_id",currentUser.id).select().single();if(error){alert(error.message);return;}myProfile=data;settingsScreen();}
function showPlus(reason=""){stopChatRefresh();setActiveNav(-1);app().innerHTML=`<div class="card paywall"><div class="crown">✦</div><div class="eyebrow">TripMatch+</div><h1>Travel farther.</h1>${reason?`<div class="notice">${esc(reason)}</div>`:""}<div class="summary" style="text-align:left"><b>Plus will include</b><span class="muted">Unlimited likes<br>Travel Mode: change your discovery city<br>See who liked you<br>Undo last pass<br>Priority discovery & profile boosts</span></div><button class="primary" onclick="alert('Payments are the next step. We can connect Stripe after this social matching flow is tested.')">Unlock TripMatch+</button><button class="secondary" style="margin-top:10px" onclick="${myProfile?"discover()":"welcome()"}">Not now</button></div>`;}
async function blockPerson(){const p=deck[deckIndex];if(!p)return;if(!confirm(`Block ${p.display_name}? You won't see each other in discovery.`))return;try{const {error}=await db.from(BLOCK_TABLE).insert({blocker_user_id:currentUser.id,blocked_user_id:p.user_id});if(error)throw error;if(deck[deckIndex]?.user_id===p.user_id){deckIndex++;showCard();}}catch(error){alert('Could not block this person. Please try again.');}}
function reportPerson(){const p=deck[deckIndex];if(!p)return;const dialog=makeChatDialog('Report '+p.display_name,`<p>Tell us what happened.</p><form id="discoverReportForm"><label for="discoverReportReason">Reason</label><select id="discoverReportReason" required><option value="" selected disabled>Choose a reason</option><option>Fake profile</option><option>Harassment</option><option>Spam or scam</option><option>Inappropriate content</option><option>Other</option></select><label for="discoverReportDetails">Details (optional)</label><textarea id="discoverReportDetails" maxlength="400" placeholder="Add anything that would help us understand."></textarea><p class="dialog-error" role="alert"></p><button class="primary" type="submit">Submit report</button></form>`,'report-dialog');dialog.querySelector('form').onsubmit=async event=>{event.preventDefault();const reason=dialog.querySelector('#discoverReportReason').value,details=dialog.querySelector('#discoverReportDetails').value.trim(),button=dialog.querySelector('button[type=submit]');if(!reason)return;button.disabled=true;const {error}=await db.from(REPORT_TABLE).insert({reporter_user_id:currentUser.id,reported_user_id:p.user_id,reason:(reason+(details?' · '+details:'')).slice(0,500)});if(error){dialog.querySelector('.dialog-error').textContent='Could not submit your report. Please try again.';button.disabled=false;return;}dialog.close();if(deck[deckIndex]?.user_id===p.user_id){deckIndex++;showCard();}else alert('Report submitted. Thank you for letting us know.');};}

boot();
</script>
