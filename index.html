<style>
*{box-sizing:border-box}
:root{--bg:#fffaf7;--card:#fff;--ink:#17212b;--muted:#68727b;--line:#eee1da;--accent:#ff5961;--soft:#fff0ed}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:760px;margin:auto;padding:18px 18px 92px}.nav{display:flex;justify-content:space-between;align-items:center;padding:7px 0 16px}
.brand{font-size:26px;font-weight:950;letter-spacing:-1.2px}.brand span{color:var(--accent)}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 55px #2b201b12;margin:13px 0}.eyebrow{font-size:12px;letter-spacing:1.25px;text-transform:uppercase;font-weight:900;color:var(--accent)}
h1{font-size:43px;line-height:1;letter-spacing:-2.6px;margin:11px 0 15px}h2{font-size:29px;line-height:1.08;letter-spacing:-1.5px;margin:8px 0 12px}.muted{color:var(--muted);line-height:1.5}
.primary,.secondary{width:100%;padding:15px 16px;border-radius:15px;font-weight:900}.primary{border:0;background:var(--accent);color:#fff;box-shadow:0 10px 25px #ff59612c}.secondary{border:1px solid #ddd0c9;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd0c9;border-radius:14px;padding:13px;background:#fff;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #ddd0c9;background:#fff;border-radius:999px;padding:9px 12px;font-weight:750}.tag.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.summary{background:#faf6f3;border-radius:16px;padding:14px;margin:13px 0}.summary b{display:block;margin-bottom:4px}.notice{padding:13px;border-radius:14px;background:#fff1ee;color:#8f3d43;font-size:13px;line-height:1.45;margin:13px 0}.good{padding:13px;border-radius:14px;background:#eef9f2;color:#25613c;font-size:13px;margin:13px 0}
.profilehero{height:420px;border-radius:25px;background:linear-gradient(145deg,#ffe7df,#f3e6ff);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:22px}.avatar{position:absolute;inset:0;display:grid;place-items:center;font-size:112px;font-weight:950;color:#fff;text-shadow:0 8px 35px #0002}.profileoverlay{position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#17212be8)}.profilecontent{position:relative;color:#fff;width:100%;z-index:2}.profilecontent h2{font-size:36px;margin:0 0 5px;color:#fff}.profilemeta{font-size:14px;opacity:.92}.score{position:absolute;right:17px;top:17px;z-index:3;background:#fffffff2;color:var(--ink);padding:10px 12px;border-radius:999px;font-weight:950}
.profilebody{padding:19px 0 0}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{font-size:12px;padding:7px 9px;border-radius:999px;background:#f5efec}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.pass{border:1px solid #ddd0c9;background:#fff;color:#8d4348;border-radius:16px;padding:15px;font-weight:900}.like{border:0;background:var(--accent);color:#fff;border-radius:16px;padding:15px;font-weight:900}.counter{text-align:center;font-size:12px;color:#8b9298;margin:11px 0}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}.bottomnav button{border:0;background:transparent;padding:8px 5px;color:#747d85;font-size:11px;font-weight:800}.bottomnav button b{display:block;font-size:21px;line-height:1.1;margin-bottom:2px}
.matchrow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #f0e6e0}.matchrow:last-child{border-bottom:0}.miniavatar{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,#ffe7df,#f3e6ff);display:grid;place-items:center;font-size:22px;font-weight:950}.matchrow .grow{flex:1}.matchrow small{color:var(--muted)}.paywall{text-align:center}.crown{font-size:54px}.tiny{font-size:12px;color:#8b9298;text-align:center;margin:21px 0}.sliderline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}.danger{border:0;background:transparent;color:#a94e54;padding:8px;font-size:12px;text-decoration:underline}
.chathead{display:flex;align-items:center;gap:12px;margin-bottom:14px}.chathead .grow{flex:1}.messages{height:min(52vh,520px);overflow:auto;background:#faf6f3;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:9px}.msgrow{display:flex}.msgrow.mine{justify-content:flex-end}.bubble{max-width:78%;padding:10px 13px;border-radius:17px;background:#fff;border:1px solid #eadfd9;line-height:1.35;word-break:break-word}.mine .bubble{background:var(--accent);color:#fff;border-color:var(--accent)}.msgtime{display:block;font-size:10px;opacity:.66;margin-top:4px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.composer input{min-width:0;border:1px solid #ddd0c9;border-radius:15px;padding:13px;background:#fff}.sendbtn{border:0;background:var(--ink);color:#fff;border-radius:15px;padding:0 17px;font-weight:900}.backlink{border:0;background:transparent;font-weight:900;color:var(--ink);padding:5px 0}.emptychat{text-align:center;color:var(--muted);padding:34px 14px;line-height:1.45}
@media(max-width:560px){h1{font-size:39px}.row{grid-template-columns:1fr}.profilehero{height:390px}.messages{height:48vh}}

/* TripMatch V13 · conversation design */
.bottomnav button b{display:flex;align-items:center;justify-content:center;height:25px;margin-bottom:5px}.bottomnav svg{width:22px;height:22px}.bottomnav button{font-weight:500}
.matches-card{box-shadow:none;border-radius:20px}.matches-card h2{font-size:30px;font-weight:650;letter-spacing:-1px}.matches-card .eyebrow{color:#847078;font-weight:600;letter-spacing:1.5px}.matches-card .miniavatar{border-radius:50%;background:#efe9e6;color:#68565a;font-weight:500;font-size:19px}.matchrow{padding:20px 0}.matchrow b{font-weight:600}.matchrow small{font-size:12px}.matchrow .iconbtn{color:#624550;border:0;background:#f6f2f3;font-size:13px;font-weight:600;padding:10px 16px}
body.chat-mode{background:#fff;overflow:hidden;position:fixed;inset:0}.chat-mode .wrap{padding:0;max-width:760px;height:var(--chat-height,100dvh);position:relative;top:var(--chat-top,0px)}.chat-mode .nav,.chat-mode .bottomnav{display:none!important}.chat-mode #app{height:100%}
.chat-shell{height:100%;display:flex;flex-direction:column;background:#fff;color:#28252a}.chat-header{display:flex;align-items:center;gap:13px;flex-shrink:0;padding:18px 20px;border-bottom:1px solid #eeeaea}.chat-back{display:grid;place-items:center;width:40px;height:44px;flex-shrink:0;border:0;background:transparent;color:#423840;border-radius:50%}.chat-back svg{width:23px;height:23px}.chat-person{display:flex;align-items:center;gap:12px}.chat-avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#efe9e6;color:#69575c;font-size:17px;font-weight:500}.chat-person h3{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.3px}.chat-city{font-size:12px;color:#868087}.chat-wordmark{margin-left:auto;font-size:11px;letter-spacing:.8px;color:#9b9196}
.chat-shell .messages{height:auto;flex:1;min-height:0;background:#fff;border-radius:0;padding:24px 22px;gap:5px;overscroll-behavior:contain;overflow-y:auto}.chat-shell .msgrow{flex-direction:column;align-items:flex-start;flex-shrink:0;margin:3px 0}.chat-shell .msgrow.mine{align-items:flex-end}.chat-shell .bubble{border:0;border-radius:18px 18px 18px 5px;background:#f1f0ee;color:#353139;padding:11px 15px;font-size:15px;line-height:1.5;max-width:82%;white-space:pre-wrap;overflow-wrap:anywhere}.chat-shell .mine .bubble{background:#59404d;color:#fff;border-radius:18px 18px 5px 18px}.chat-shell .msgtime{font-size:10px;color:#948c93;margin:5px 4px 0;opacity:1}.chat-date{text-align:center;color:#968b93;font-size:11px;letter-spacing:.2px;margin:14px 0 19px;flex-shrink:0}.chat-shell .emptychat{margin:auto;max-width:260px;padding:35px 0;color:#93888f;font-size:14px;line-height:1.65}.emptychat .chat-avatar{width:70px;height:70px;margin:0 auto 20px;font-size:25px}.emptychat h4{color:#473943;font-size:21px;letter-spacing:-.5px;font-weight:500;margin:0 0 9px}.emptychat p{margin:0}.chat-composer-area{flex-shrink:0;border-top:1px solid #eeeaea;padding:15px 18px max(16px,env(safe-area-inset-bottom));background:#fff}.chat-shell .composer{display:flex;align-items:flex-end;gap:10px;margin:0;padding:5px 5px 5px 17px;border:1px solid #e5dfe2;border-radius:25px;background:#fff}.composer textarea{font:inherit;font-size:16px;line-height:22px;flex:1;min-width:0;padding:8px 0;border:0;background:transparent;outline:none;resize:none;height:38px;max-height:110px;color:#332c33}.composer textarea::placeholder{color:#a1979e}.composer:focus-within{border-color:#9b818e;box-shadow:0 0 0 2px #59404d0a}.chat-shell .sendbtn{width:38px;height:38px;flex-shrink:0;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:#59404d;color:white}.sendbtn svg{width:20px;height:20px}.chat-shell .sendbtn:disabled{background:#f0ebee;color:#b0a3ac;cursor:default}.chat-note{display:flex;align-items:center;justify-content:center;gap:5px;color:#a69aa2;font-size:10px;margin:10px 0 0}.chat-note svg{width:11px;height:11px}.chat-error{color:#963d4f;font-size:12px;line-height:1.5;margin:8px 4px 0}.chat-error:empty{display:none}button:focus-visible{outline:2px solid #8d6b7e;outline-offset:3px}
@media(min-width:761px){body.chat-mode{background:#f6f3f4}.chat-shell{border-left:1px solid #eeeaea;border-right:1px solid #eeeaea}.chat-header{padding:20px 28px}.chat-shell .messages{padding:25px 34px}.chat-composer-area{padding:20px 28px}.chat-shell .bubble{max-width:72%}}


#travelerCard{position:relative;touch-action:pan-y;will-change:transform;user-select:none;-webkit-user-select:none;transform-origin:50% 65%}body{overflow-x:hidden}.swipe-indicator{position:absolute;top:25px;z-index:5;padding:8px 13px;border:2px solid currentColor;border-radius:9px;letter-spacing:2px;font-size:19px;font-weight:650;opacity:0;pointer-events:none;background:#fffffff0}.swipe-indicator.like-indicator{left:22px;color:#326452;transform:rotate(-9deg)}.swipe-indicator.pass-indicator{right:22px;color:#855367;transform:rotate(9deg)}

.auth-card{max-width:470px;margin:24px auto;box-shadow:none;border-radius:22px}.auth-card h2{font-size:32px;font-weight:600;letter-spacing:-1px}.auth-card .eyebrow{color:#8d6e7e;font-weight:600}.auth-card .primary,.account-card .primary{background:#59404d;box-shadow:none;font-weight:600}.auth-card label{font-weight:500}.auth-card input{font-size:16px}.auth-link{display:block;border:0;background:transparent;color:#705264;font-size:14px;padding:12px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}.auth-links{margin-top:12px;display:flex;flex-direction:column;align-items:flex-start}.auth-check{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.5;margin:16px 0}.auth-check input{margin-top:4px}.account-card{box-shadow:none}.account-card h3{font-weight:600}.auth-card button:disabled{opacity:.5;cursor:wait}#authMessage:empty{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="nav"><div class="brand">Trip<span>Match</span></div><button class="iconbtn" onclick="showPlus()">✦ Plus</button></div><div id="app"></div></div>
<div class="bottomnav" id="bottomnav" style="display:none">
<button onclick="discover()"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/></svg></b>Discover</button><button onclick="showMatches()"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 3v-11a9 9 0 0 1 18 0Z"/></svg></b>Matches</button><button onclick="groupMode()"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-7 18-3-8-8-3Z"/><path d="m11 13 10-10"/></svg></b>Group trip</button><button onclick="profileScreen()"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></b>Profile</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let authIntent=new URLSearchParams(location.search).get('auth')||'';
const initialAuthHash=new URLSearchParams(location.hash.slice(1));
let recoveryRequested=initialAuthHash.get('type')==='recovery',authBusy=false,authBooting=false;
const initialAuthError=initialAuthHash.get('error_description')||new URLSearchParams(location.search).get('error_description');
const db=supabase.createClient("https://grjeliceompgijgcsrvt.supabase.co","sb_publishable_6sKOKMtEAqOWlo6y8PoTEA_VGoFtSUX");
const PROFILE_TABLE="traveler_profiles",LIKE_TABLE="traveler_likes",MATCH_TABLE="traveler_matches",MESSAGE_TABLE="traveler_messages",BLOCK_TABLE="traveler_blocks",REPORT_TABLE="traveler_reports";
let currentUser=null,myProfile=null,deck=[],deckIndex=0,passed=new Set(),selectedVibes=[],selectedDestinations=[],chatRefreshTimer=null,activeChat=null;
const CITIES={"Malmö":{lat:55.605,lng:13.003},"Copenhagen":{lat:55.676,lng:12.568},"Gothenburg":{lat:57.708,lng:11.974},"Stockholm":{lat:59.329,lng:18.069},"Oslo":{lat:59.913,lng:10.752},"Berlin":{lat:52.520,lng:13.405},"Amsterdam":{lat:52.367,lng:4.904},"London":{lat:51.507,lng:-0.128},"Paris":{lat:48.857,lng:2.352},"Barcelona":{lat:41.387,lng:2.170},"Madrid":{lat:40.417,lng:-3.704},"Rome":{lat:41.903,lng:12.496},"Athens":{lat:37.984,lng:23.728},"Lisbon":{lat:38.722,lng:-9.139},"Prague":{lat:50.075,lng:14.438},"Budapest":{lat:47.498,lng:19.040}};
const VIBES=["Beach","City","Food","Nightlife","Culture","Nature","Adventure","Romance","Luxury","Backpacking"];
const DESTS=["Mallorca","Lisbon","Sicily","Santorini","Split","Barcelona","Crete","Prague","Madeira","Rome","Paris","Amsterdam","Mykonos","Corfu","Malta","Ibiza","Tenerife","Istanbul"];
const LOOKING=["Travel buddy","Weekend trips","Group trips","Backpacking","Luxury trips","Girls trips","Digital nomad buddy"];
const app=()=>document.getElementById("app");
const esc=(s="")=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
const parseArr=v=>{try{const a=JSON.parse(v||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}};
const initials=n=>(n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();

async function ensureUser(){if(currentUser)return currentUser;const {data:{session}}=await db.auth.getSession();if(session?.user){currentUser=session.user;return currentUser;}const {data,error}=await db.auth.signInAnonymously();if(error)throw error;currentUser=data.user||data.session?.user;return currentUser;}
function nav(on=true){document.getElementById("bottomnav").style.display=on?"grid":"none";}
function stopChatRefresh(){if(chatRefreshTimer){clearInterval(chatRefreshTimer);chatRefreshTimer=null;}activeChat=null;document.body.classList.remove("chat-mode");}
async function loadMyProfile(){await ensureUser();const {data,error}=await db.from(PROFILE_TABLE).select("*").eq("user_id",currentUser.id).maybeSingle();if(error)throw error;myProfile=data||null;return myProfile;}
function clearUserState(){stopChatRefresh();myProfile=null;deck=[];deckIndex=0;passed=new Set();selectedVibes=[];selectedDestinations=[];}
function takeUser(user){if(currentUser?.id!==user?.id)clearUserState();currentUser=user||null;}
function pendingAccount(){try{return JSON.parse(localStorage.getItem('tripmatch_pending_account')||'null')}catch(e){return null}}
function storePending(value){try{if(value)localStorage.setItem('tripmatch_pending_account',JSON.stringify(value));else localStorage.removeItem('tripmatch_pending_account')}catch(e){}}
function cleanAuthUrl(){authIntent='';recoveryRequested=false;try{const u=new URL(location.href);u.searchParams.delete('auth');u.searchParams.delete('error');u.searchParams.delete('error_description');u.hash='';history.replaceState(null,'',u)}catch(e){}}
function authReturn(action){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('auth',action);return u.href;}
async function boot(){if(authBooting)return;authBooting=true;try{const {data,error}=await db.auth.getSession();if(error)throw error;takeUser(data.session?.user);if(initialAuthError&&!window.authErrorShown){window.authErrorShown=true;authScreen('login');authMessage('This email link has expired or could not be verified. Request a new link below.');return;}if(recoveryRequested||authIntent==='reset'){if(currentUser&&!currentUser.is_anonymous)passwordScreen(true);else{authScreen('forgot');authMessage('Open the latest password-reset link from your email.');}return;}const pending=pendingAccount();if(currentUser&&!currentUser.is_anonymous&&currentUser.email_confirmed_at&&(authIntent==='finish'||pending?.id===currentUser.id)){passwordScreen(false);return;}cleanAuthUrl();if(!currentUser){nav(false);welcome();return;}await loadMyProfile();if(myProfile){nav(true);await discover();}else{nav(false);welcome();}}catch(err){nav(false);app().innerHTML=`<div class="card"><h2>Could not open TripMatch</h2><p class="muted">${esc(err.message)}</p><button class="secondary" onclick="boot()">Try again</button></div>`;}finally{authBooting=false;}}
if(db.auth?.onAuthStateChange)db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')recoveryRequested=true;if(event==='INITIAL_SESSION'||authBusy||authBooting)return;const changed=currentUser?.id!==session?.user?.id;if(event==='SIGNED_OUT'||event==='PASSWORD_RECOVERY'||changed||(event==='USER_UPDATED'&&pendingAccount()))setTimeout(()=>boot(),0);});
function authMessage(message,good=false){const el=document.getElementById('authMessage');if(el){el.textContent=message;el.className=good?'good':'notice';}}
function authPanel(title,body){stopChatRefresh();nav(false);app().innerHTML=`<section class="card auth-card"><div class="eyebrow">Your TripMatch account</div><h2>${title}</h2>${body}<div id="authMessage" role="status" aria-live="polite"></div></section>`;}
function authScreen(mode='register'){const guest=!!currentUser?.is_anonymous;const title=mode==='login'?'Welcome back':mode==='forgot'?'Reset your password':guest?'Keep your connections':'Create your account';const needsPassword=mode==='login'||(mode==='register'&&!guest);authPanel(title,`<p class="muted">${mode==='forgot'?'We’ll email you a link to choose a new password.':mode==='login'?'Log in to your profile, matches and conversations.':guest?'Add your email to keep this profile, your matches and your chats. Verify your email, then choose a password.':'Find your travel people. Keep your connections wherever you go.'}</p>${mode==='login'&&guest&&myProfile?`<div class="notice">Logging into another account switches away from this guest profile. To keep these matches and chats, <button class="auth-link" type="button" onclick="authScreen('register')">register this profile first</button>.</div>`:''}<form onsubmit="event.preventDefault();submitAuth('${mode}')"><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required value="${esc(guest?(pendingAccount()?.email||''):'')}"></div>${needsPassword?`<div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" ${mode==='register'?'minlength="8"':''} maxlength="128" required>${mode==='register'?'<small class="muted">At least 8 characters.</small>':''}</div>`:''}${mode==='login'&&guest&&myProfile?'<label class="auth-check"><input id="switchConsent" type="checkbox" required> I understand my guest profile will not transfer to another account.</label>':''}<button id="authSubmit" class="primary" type="submit">${mode==='login'?'Log in':mode==='forgot'?'Send reset link':guest?'Verify my email':'Create account'}</button></form><div class="auth-links">${mode==='login'?`<button class="auth-link" onclick="authScreen('forgot')">Forgot password?</button><button class="auth-link" onclick="authScreen('register')">Create an account</button>`:`<button class="auth-link" onclick="authScreen('login')">Already registered? Log in</button>`}<button class="auth-link" onclick="resumeTripMatch()">${currentUser?'Back to TripMatch':'Back'}</button></div>`);}
async function resumeTripMatch(){if(recoveryRequested)return passwordScreen(true);cleanAuthUrl();if(myProfile)discover();else welcome();}
async function submitAuth(mode){if(authBusy)return;authBusy=true;const button=document.getElementById('authSubmit'),email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword')?.value;button.disabled=true;authMessage('');try{if(mode==='login'){if(currentUser?.is_anonymous&&myProfile&&!document.getElementById('switchConsent')?.checked)throw Error('Confirm that you want to switch accounts.');const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;takeUser(data.user);cleanAuthUrl();await boot();}else if(mode==='forgot'){const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:authReturn('reset')});if(error)throw error;authMessage('If an account exists for this email, a reset link has been requested. Check your inbox and spam folder.',true);}else if(currentUser?.is_anonymous){const id=currentUser.id;const {data,error}=await db.auth.updateUser({email},{emailRedirectTo:authReturn('finish')});if(error)throw error;if(data.user?.id!==id)throw Error('Could not verify your existing profile. Please try again.');storePending({id,email});currentUser=data.user;if(!currentUser.is_anonymous&&currentUser.email_confirmed_at)passwordScreen(false);else verificationScreen(email,true);}else{if(!password||password.length<8)throw Error('Choose a password with at least 8 characters.');const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:authReturn('welcome')}});if(error)throw error;if(data.session){takeUser(data.user);await boot();}else verificationScreen(email,false);}}catch(error){authMessage(error.message||'Please try again.');}finally{authBusy=false;if(button.isConnected)button.disabled=false;}}
function verificationScreen(email,linking){authPanel('Check your email',`<p class="muted">Open the confirmation link sent to <strong>${esc(email)}</strong>. ${linking?'Then choose your password to finish saving this profile.':'Once verified, you can log in and create your travel profile.'}</p><p class="muted">Check your spam folder too. Keep this browser open until you finish.</p><button class="primary" id="authSubmit" onclick="checkEmailConfirmation()">I’ve verified my email</button><div class="auth-links"><button class="auth-link" onclick="authScreen('${linking?'register':'login'}')">${linking?'Change email or request a new link':'Go to login'}</button><button class="auth-link" onclick="resumeTripMatch()">Back to TripMatch</button></div>`);}
async function checkEmailConfirmation(){if(authBusy)return;authBusy=true;try{const {data,error}=await db.auth.getUser();if(error)throw error;takeUser(data.user);if(!currentUser?.email_confirmed_at||currentUser.is_anonymous)throw Error('Please open the confirmation link in your email first.');const {error:refreshError}=await db.auth.refreshSession();if(refreshError)throw refreshError;await boot();}catch(error){authMessage(error.message||'Please open the confirmation email, then log in.');}finally{authBusy=false;}}
function passwordScreen(recovery){authPanel(recovery?'Choose a new password':'Finish your account',`<p class="muted">${recovery?'Set a password you haven’t used before.':'Your email is verified. Add a password to access your profile and chats from another device.'}</p><form onsubmit="event.preventDefault();saveAccountPassword()"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small class="muted">At least 8 characters.</small></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><button id="authSubmit" class="primary" type="submit">Save password</button></form>`);}
async function saveAccountPassword(){if(authBusy)return;const pass=document.getElementById('newPassword').value,confirmPass=document.getElementById('confirmPassword').value;if(pass.length<8||pass!==confirmPass){authMessage('Passwords must match and contain at least 8 characters.');return;}authBusy=true;const b=document.getElementById('authSubmit');b.disabled=true;try{const {data:verified,error:userError}=await db.auth.getUser();if(userError)throw userError;if(!verified.user?.email_confirmed_at||verified.user.is_anonymous)throw Error('Verify your email before setting a password.');const {data,error}=await db.auth.updateUser({password:pass});if(error)throw error;takeUser(data.user);storePending(null);cleanAuthUrl();await loadMyProfile();authPanel('You’re all set',`<p class="muted">Your password is saved. Use your email and password to log in on another device.</p><button class="primary" onclick="resumeTripMatch()">Continue to TripMatch</button>`);}catch(error){authMessage(error.message);}finally{authBusy=false;if(b.isConnected)b.disabled=false;}}
function accountCard(){if(!currentUser)return '';const pending=pendingAccount();if(currentUser.is_anonymous)return `<div class="card account-card"><h3>Keep your connections</h3><p class="muted">Save this profile, your matches and your chats with an email account.</p><button class="primary" onclick="authScreen('register')">Create my account</button><button class="auth-link" onclick="authScreen('login')">Already have an account? Log in</button></div>`;if(pending?.id===currentUser.id)return `<div class="card account-card"><h3>Finish your account</h3><button class="primary" onclick="passwordScreen(false)">Set your password</button></div>`;return `<div class="card account-card"><h3>Your account</h3><p class="muted">${esc(currentUser.email||'')}</p><button class="secondary" onclick="authScreen('forgot')">Reset password</button><button class="auth-link" onclick="signOutAccount()">Log out</button><div id="accountError" role="alert"></div></div>`;}

function welcome(){stopChatRefresh();nav(false);app().innerHTML=`<div class="card"><div class="eyebrow">Travel buddy matching</div><h1>Good trips start with good company.</h1><p class="muted">Meet people who share your destinations, budget and travel style.</p>${currentUser?`<button class="primary" onclick="profileForm()">Create my profile</button>${currentUser.is_anonymous?'<button class="secondary" style="margin-top:10px" onclick="authScreen()">Save my account</button>':''}`:`<button class="primary" onclick="authScreen('register')">Create account</button><button class="secondary" style="margin-top:10px" onclick="authScreen('login')">Log in</button><button class="auth-link" onclick="startGuest()">Explore as a guest</button>`}<button class="auth-link" onclick="groupMode()">Plan a group trip</button><div id="authMessage" role="status"></div></div><div class="tiny">TripMatch Social V15 · 18+ only</div>`;}
function cityOptions(selected=""){return Object.keys(CITIES).map(c=>`<option ${c===selected?"selected":""}>${c}</option>`).join("");}

<button class="primary" onclick="saveProfile()">Save profile →</button></div>`;}
function toggleChoice(btn,type,value){const arr=type==="vibe"?selectedVibes:selectedDestinations;const i=arr.indexOf(value);if(i>=0)arr.splice(i,1);else arr.push(value);btn.classList.toggle("on");}
async function saveProfile(){const name=document.getElementById("name").value.trim(),age=+document.getElementById("age").value,city=document.getElementById("city").value,c=CITIES[city],minAge=+document.getElementById("minAge").value,maxAge=+document.getElementById("maxAge").value;if(!name||age<18){alert("Add your name and make sure age is 18+.");return;}if(minAge>maxAge){alert("Minimum age can't be higher than maximum age.");return;}if(selectedVibes.length<1){alert("Choose at least one travel vibe.");return;}const row={user_id:currentUser.id,display_name:name,age,bio:document.getElementById("bio").value.trim(),city,lat:c.lat,lng:c.lng,distance_km:+document.getElementById("distance").value,min_age:minAge,max_age:maxAge,vibes:JSON.stringify(selectedVibes),destinations:JSON.stringify(selectedDestinations),looking_for:document.getElementById("looking").value,languages:document.getElementById("languages").value.trim(),budget:document.getElementById("budget").value};const {data,error}=await db.from(PROFILE_TABLE).upsert(row).select().single();if(error){alert("Could not save profile: "+error.message);return;}myProfile=data;nav(true);discover();}
function haversine(a,b){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng);const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function compat(other){const myV=parseArr(myProfile.vibes),theirV=parseArr(other.vibes),myD=parseArr(myProfile.destinations),theirD=parseArr(other.destinations);const commonV=myV.filter(x=>theirV.includes(x)).length,commonD=myD.filter(x=>theirD.includes(x)).length;let score=35*Math.min(1,commonV/3)+35*Math.min(1,commonD/2);if(myProfile.budget===other.budget)score+=15;if(myProfile.looking_for===other.looking_for)score+=15;return Math.max(35,Math.min(99,Math.round(score)));}
function effectiveLoc(){if(myProfile?.is_plus&&myProfile.travel_mode_lat!=null)return{lat:myProfile.travel_mode_lat,lng:myProfile.travel_mode_lng,city:myProfile.travel_mode_city};return{lat:myProfile.lat,lng:myProfile.lng,city:myProfile.city};}
async function likesToday(){const start=new Date();start.setHours(0,0,0,0);const {data,error}=await db.from(LIKE_TABLE).select("id").eq("liker_user_id",currentUser.id).gte("created_at",start.toISOString());return error?0:(data||[]).length;}
async function discover(){stopChatRefresh();if(!myProfile){profileForm();return;}nav(true);app().innerHTML=`<div class="card"><h2>Finding travelers…</h2><p class="muted">Checking distance and travel compatibility.</p></div>`;const [profilesRes,likesRes,blocksRes]=await Promise.all([db.from(PROFILE_TABLE).select("*").neq("user_id",currentUser.id),db.from(LIKE_TABLE).select("liked_user_id").eq("liker_user_id",currentUser.id),db.from(BLOCK_TABLE).select("blocked_user_id").eq("blocker_user_id",currentUser.id)]);if(profilesRes.error){app().innerHTML=`<div class="card"><h2>Could not load travelers</h2><p class="muted">${esc(profilesRes.error.message)}</p></div>`;return;}const liked=new Set((likesRes.data||[]).map(x=>x.liked_user_id)),blocked=new Set((blocksRes.data||[]).map(x=>x.blocked_user_id)),loc=effectiveLoc();deck=(profilesRes.data||[]).map(p=>({...p,_distance:Math.round(haversine(loc,p)),_score:compat(p)})).filter(p=>!liked.has(p.user_id)&&!blocked.has(p.user_id)&&!passed.has(p.user_id)&&p.age>=myProfile.min_age&&p.age<=myProfile.max_age&&p._distance<=myProfile.distance_km).sort((a,b)=>b._score-a._score||a._distance-b._distance);deckIndex=0;showCard();}
async function showCard(){const used=await likesToday(),remaining=myProfile.is_plus?"∞":Math.max(0,100-used);if(deckIndex>=deck.length){app().innerHTML=`<div class="card" style="text-align:center"><div style="font-size:55px">🌍</div><h2>No more travelers in this range</h2><p class="muted">Try increasing your distance, changing age range, or check back when more people join.</p><button class="primary" onclick="profileScreen()">Change discovery settings</button><button class="secondary" style="margin-top:10px" onclick="discover()">Refresh people</button></div>`;return;}const p=deck[deckIndex],vibes=parseArr(p.vibes),dests=parseArr(p.destinations);app().innerHTML=`<div class="card" id="travelerCard" style="padding:0;overflow:hidden"><div class="swipe-indicator like-indicator" aria-hidden="true">LIKE</div><div class="swipe-indicator pass-indicator" aria-hidden="true">PASS</div><div class="profilehero"><div class="avatar">${esc(initials(p.display_name))}</div><div class="profileoverlay"></div><div class="score">${p._score}% match</div><div class="profilecontent"><h2>${esc(p.display_name)}, ${p.age}</h2><div class="profilemeta">📍 ${esc(p.city)} · ${p._distance} km away</div></div></div><div class="profilebody" style="padding:20px"><p>${esc(p.bio||"Ready for the next trip.")}</p><div class="chips">${vibes.slice(0,5).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><div class="summary"><b>Wants to go</b><span class="muted">${dests.length?esc(dests.slice(0,5).join(" · ")):"Open to ideas"}<br>${esc(p.looking_for)} · Budget ${esc(p.budget)}</span></div>${p.languages?`<p class="muted">Languages: ${esc(p.languages)}</p>`:""}<div class="actions"><button class="pass" onclick="chooseTraveler(false)">✕ Pass</button><button class="like" onclick="chooseTraveler(true)">♥ Like</button></div><div class="counter">${myProfile.is_plus?"Unlimited likes":remaining+" of 100 free likes left today"}</div><div style="text-align:center"><button class="danger" onclick="reportPerson()">Report</button><button class="danger" onclick="blockPerson()">Block</button></div></div></div>`;bindTravelerSwipe();}
let travelerChoicePending=false;
function resetTravelerCard(card){if(!card)return;card.style.transition='transform .18s ease, opacity .18s ease';card.style.transform='';card.style.opacity='';card.querySelectorAll('.swipe-indicator').forEach(el=>el.style.opacity='0');}
async function chooseTraveler(like){const card=document.getElementById('travelerCard');if(!card||travelerChoicePending||!deck[deckIndex])return;travelerChoicePending=true;card.querySelectorAll('button').forEach(b=>b.disabled=true);try{const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;card.style.transition=reduce?'none':'transform .18s ease-out, opacity .18s ease-out';card.style.transform=`translateX(${(like?1:-1)*Math.max(innerWidth,800)}px) rotate(${like?12:-12}deg)`;card.style.opacity='0';await new Promise(resolve=>setTimeout(resolve,reduce?0:180));if(!card.isConnected)return;if(like)await likePerson();else await passPerson();}catch(error){if(card.isConnected)alert('Could not save your choice: '+error.message);}finally{if(card.isConnected){resetTravelerCard(card);card.querySelectorAll('button').forEach(b=>b.disabled=false);}travelerChoicePending=false;}}
function bindTravelerSwipe(){const card=document.getElementById('travelerCard');if(!card)return;let gesture=null;const reset=()=>{gesture=null;resetTravelerCard(card);};card.addEventListener('pointerdown',event=>{if(travelerChoicePending||!event.isPrimary||(event.pointerType==='mouse'&&event.button!==0)||event.target.closest('button,a,input,textarea,select'))return;gesture={id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,axis:null};card.style.transition='none';card.setPointerCapture(event.pointerId);});card.addEventListener('pointermove',event=>{if(!gesture||gesture.id!==event.pointerId||travelerChoicePending)return;const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;if(!gesture.axis&&Math.max(Math.abs(dx),Math.abs(dy))>8)gesture.axis=Math.abs(dx)>Math.abs(dy)*1.15?'x':'y';if(gesture.axis!=='x')return;gesture.dx=dx;card.style.transform=`translateX(${dx}px) rotate(${Math.max(-12,Math.min(12,dx/22))}deg)`;const strength=Math.min(1,Math.abs(dx)/85);card.querySelector('.like-indicator').style.opacity=dx>0?strength:0;card.querySelector('.pass-indicator').style.opacity=dx<0?strength:0;});card.addEventListener('pointerup',event=>{if(!gesture||gesture.id!==event.pointerId)return;const g=gesture;gesture=null;if(card.hasPointerCapture(event.pointerId))card.releasePointerCapture(event.pointerId);const threshold=Math.min(85,card.clientWidth*.22);if(g.axis==='x'&&Math.abs(g.dx)>=threshold)chooseTraveler(g.dx>0);else resetTravelerCard(card);});card.addEventListener('pointercancel',reset);card.addEventListener('lostpointercapture',()=>{if(gesture)reset();});}
async function passPerson(){if(deck[deckIndex])passed.add(deck[deckIndex].user_id);deckIndex++;await showCard();}
async function likePerson(){const p=deck[deckIndex];if(!p)return;const used=await likesToday();if(!myProfile.is_plus&&used>=100){showPlus("You've used today's 100 free likes.");return;}const {error}=await db.from(LIKE_TABLE).insert({liker_user_id:currentUser.id,liked_user_id:p.user_id});if(error&&!String(error.message).toLowerCase().includes("duplicate")){alert("Could not save like: "+error.message);return;}const {data:matched}=await db.rpc("tripmatch_make_match",{p_other_user:p.user_id});if(matched){showMatch(p);return;}deckIndex++;await showCard();}
function showMatch(p){stopChatRefresh();app().innerHTML=`<div class="card" style="text-align:center"><div style="font-size:65px">🎉</div><div class="eyebrow">It's a TripMatch</div><h1>${esc(myProfile.display_name)} + ${esc(p.display_name)}</h1><p class="muted">You both liked each other. Your private match chat is now unlocked.</p><div class="good">Only mutual matches can message each other.</div><button class="primary" onclick="showMatches()">Open Matches & Chat</button><button class="secondary" style="margin-top:10px" onclick="deckIndex++;showCard()">Keep discovering</button></div>`;}
async function showMatches(){stopChatRefresh();if(!myProfile)return profileForm();nav(true);const {data,error}=await db.from(MATCH_TABLE).select("*").or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`).order("created_at",{ascending:false});if(error){alert(error.message);return;}const items=(data||[]).map(m=>({match:m,otherId:m.user_a===currentUser.id?m.user_b:m.user_a}));const ids=items.map(x=>x.otherId);let profiles=[];if(ids.length){const r=await db.from(PROFILE_TABLE).select("*").in("user_id",ids);profiles=r.data||[];}const byId=new Map(profiles.map(p=>[p.user_id,p]));app().innerHTML=`<div class="card matches-card"><div class="eyebrow">Your connections</div><h2>Matches</h2>${items.length?items.map(item=>{const p=byId.get(item.otherId);if(!p)return"";return `<div class="matchrow"><div class="miniavatar">${esc(initials(p.display_name))}</div><div class="grow"><b>${esc(p.display_name)}, ${p.age}</b><br><small>${esc(p.city)} · ${esc(p.looking_for)}</small></div><button class="iconbtn" onclick="showChat('${item.match.id}','${item.otherId}')">Chat</button></div>`;}).join(""):`<div class="summary">No matches yet. Your next travel person might be one Like away.</div>`}</div>`;}
function syncChatViewport(){const v=window.visualViewport;document.documentElement.style.setProperty('--chat-height',`${v?v.height:window.innerHeight}px`);document.documentElement.style.setProperty('--chat-top',`${v?v.offsetTop:0}px`);}
window.visualViewport?.addEventListener('resize',syncChatViewport);window.visualViewport?.addEventListener('scroll',syncChatViewport);window.addEventListener('resize',syncChatViewport);
function updateComposer(){const input=document.getElementById('messageInput'),button=document.getElementById('sendButton');if(!input||!button)return;input.style.height='38px';input.style.height=Math.min(110,input.scrollHeight)+'px';button.disabled=!input.value.trim()||!!activeChat?.sending;}
async function showChat(matchId,otherUserId){stopChatRefresh();nav(true);const {data:other,error}=await db.from(PROFILE_TABLE).select("*").eq("user_id",otherUserId).maybeSingle();if(error||!other){alert("Could not open this chat.");showMatches();return;}activeChat={matchId:String(matchId),otherUserId,otherName:other.display_name};document.body.classList.add('chat-mode');syncChatViewport();app().innerHTML=`<section class="chat-shell" aria-label="Conversation with ${esc(other.display_name)}"><header class="chat-header"><button class="chat-back" onclick="showMatches()" aria-label="Back to matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><div class="chat-person"><div class="chat-avatar" aria-hidden="true">${esc(initials(other.display_name))}</div><div><h3>${esc(other.display_name)}</h3><div class="chat-city">${esc(other.city)}</div></div></div><div class="chat-wordmark">TripMatch</div></header><div id="messages" class="messages" role="log" aria-label="Messages"><div class="emptychat">Loading your conversation…</div></div><div class="chat-composer-area"><form class="composer" onsubmit="event.preventDefault();sendMessage()"><textarea id="messageInput" rows="1" maxlength="1000" aria-label="Message ${esc(other.display_name)}" placeholder="Message…" oninput="updateComposer()" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendMessage()}"></textarea><button id="sendButton" class="sendbtn" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form><div id="chatError" class="chat-error" role="alert"></div><p class="chat-note">A conversation between you and ${esc(other.display_name)}</p></div></section>`;const chat=activeChat;await loadChatMessages(true);if(activeChat===chat)chatRefreshTimer=setInterval(()=>loadChatMessages(false),2500);}
function chatDateLabel(value){const d=new Date(value),today=new Date(),yesterday=new Date();yesterday.setDate(today.getDate()-1);if(d.toDateString()===today.toDateString())return 'Today';if(d.toDateString()===yesterday.toDateString())return 'Yesterday';return d.toLocaleDateString([],{month:'short',day:'numeric',...(d.getFullYear()!==today.getFullYear()?{year:'numeric'}:{})});}
async function loadChatMessages(scrollToEnd=false){const chat=activeChat;if(!chat)return;const {data,error}=await db.from(MESSAGE_TABLE).select("*").eq("match_id",chat.matchId).order("created_at",{ascending:true}).limit(200);if(activeChat!==chat)return;const box=document.getElementById("messages");if(!box)return;if(error){document.getElementById('chatError').textContent='Could not load messages: '+error.message;return;}const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90,rows=data||[],signature=JSON.stringify(rows);if(signature!==chat.lastMessages){chat.lastMessages=signature;let previousDate='';box.innerHTML=rows.length?rows.map(m=>{const mine=m.sender_user_id===currentUser.id,d=chatDateLabel(m.created_at),separator=d!==previousDate?`<div class="chat-date">${esc(d)}</div>`:'';previousDate=d;const t=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return `${separator}<div class="msgrow ${mine?'mine':''}"><div class="bubble">${esc(m.body)}</div><time class="msgtime" datetime="${esc(m.created_at)}">${esc(t)}</time></div>`;}).join(""):`<div class="emptychat"><div class="chat-avatar" aria-hidden="true">${esc(initials(chat.otherName))}</div><h4>You and ${esc(chat.otherName)}</h4><p>A new connection.<br>Start with a hello.</p></div>`;}if(scrollToEnd||nearBottom)box.scrollTop=box.scrollHeight;}
async function sendMessage(){const chat=activeChat,input=document.getElementById('messageInput');if(!chat||!input||chat.sending)return;const body=input.value.trim();if(!body)return;const original=input.value;chat.sending=true;document.getElementById('chatError').textContent='';updateComposer();try{const {error}=await db.from(MESSAGE_TABLE).insert({match_id:+chat.matchId,sender_user_id:currentUser.id,body});if(error)throw error;if(activeChat!==chat)return;if(input.value===original)input.value='';input.focus({preventScroll:true});await loadChatMessages(true);}catch(error){if(activeChat===chat)document.getElementById('chatError').textContent='Could not send. '+error.message;}finally{chat.sending=false;if(activeChat===chat)updateComposer();}}
function profileScreen(){stopChatRefresh();if(!myProfile)return profileForm();nav(true);const travel=myProfile.travel_mode_city?`Travel Mode: ${esc(myProfile.travel_mode_city)}`:"Travel Mode off";app().innerHTML=`<div class="card"><div class="eyebrow">Your profile</div><h2>${esc(myProfile.display_name)}, ${myProfile.age}</h2><div class="summary"><b>📍 ${esc(myProfile.city)}</b><span class="muted">Matching within ${myProfile.distance_km} km · Ages ${myProfile.min_age}–${myProfile.max_age}<br>${travel}</span></div><button class="primary" onclick="profileForm()">Edit profile & filters</button><button class="secondary" style="margin-top:10px" onclick="travelMode()">✈️ Change discovery location</button><button class="secondary" style="margin-top:10px" onclick="groupMode()">👥 Group Trip mode</button></div>${accountCard()}`;}
function travelMode(){if(!myProfile?.is_plus){showPlus("Travel Mode lets you match from another city before you arrive.");return;}app().innerHTML=`<div class="card"><div class="eyebrow">Travel Mode</div><h2>Match from another city</h2><div class="field"><label>Discovery city</label><select id="travelCity">${cityOptions(myProfile.travel_mode_city||myProfile.city)}</select></div><button class="primary" onclick="saveTravelMode()">Use this city</button></div>`;}
async function saveTravelMode(){const city=document.getElementById("travelCity").value,c=CITIES[city];const {data,error}=await db.from(PROFILE_TABLE).update({travel_mode_city:city,travel_mode_lat:c.lat,travel_mode_lng:c.lng}).eq("user_id",currentUser.id).select().single();if(error){alert(error.message);return;}myProfile=data;discover();}
function showPlus(reason=""){stopChatRefresh();app().innerHTML=`<div class="card paywall"><div class="crown">✦</div><div class="eyebrow">TripMatch+</div><h1>Travel farther.</h1>${reason?`<div class="notice">${esc(reason)}</div>`:""}<div class="summary" style="text-align:left"><b>Plus will include</b><span class="muted">Unlimited likes<br>Travel Mode: change your discovery city<br>See who liked you<br>Undo last pass<br>Priority discovery & profile boosts</span></div><button class="primary" onclick="alert('Payments are the next step. We can connect Stripe after this social matching flow is tested.')">Unlock TripMatch+</button><button class="secondary" style="margin-top:10px" onclick="${myProfile?"discover()":"welcome()"}">Not now</button></div>`;}
async function blockPerson(){const p=deck[deckIndex];if(!p)return;if(!confirm(`Block ${p.display_name}? You won't see each other in discovery.`))return;await db.from(BLOCK_TABLE).insert({blocker_user_id:currentUser.id,blocked_user_id:p.user_id});deckIndex++;showCard();}
async function reportPerson(){const p=deck[deckIndex];if(!p)return;const reason=prompt("Briefly tell us why you're reporting this profile:");if(!reason)return;await db.from(REPORT_TABLE).insert({reporter_user_id:currentUser.id,reported_user_id:p.user_id,reason:reason.slice(0,500)});alert("Report submitted.");deckIndex++;showCard();}
function groupMode(){stopChatRefresh();location.href="group.html";}
boot();
</script>
